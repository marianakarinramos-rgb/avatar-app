<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IA Studio Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .canvas-wrapper { width: 100%; max-width: 380px; margin: 0 auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .magic-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .magic-btn:hover { background: #06b6d4; color: #0b0f19; border-color: #06b6d4; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50">
        <div>
            <h1 class="text-base font-black text-white tracking-tight">GESTO SMART <span class="text-cyan-400">STUDIO</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl" title="Configurar API">⚙️</button>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
            <h2 class="font-bold text-lg mb-2 text-white">Motor IA (Google Gemini)</h2>
            <p class="text-xs text-slate-400 mb-4">La app incluye Auto-Reintento por si los servidores están saturados.</p>
            
            <label class="block text-xs font-bold text-slate-400 mb-1">API Key de Gemini</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-cyan-500">
            
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm hover:bg-slate-600">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-cyan-500 text-slate-900 p-3 rounded-lg font-bold text-sm hover:bg-cyan-400">Guardar</button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-4 mb-24">
        
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 shadow-lg">
            
            <label class="block w-full bg-slate-800 hover:bg-slate-700 transition text-center p-3 rounded-xl border border-dashed border-slate-500 cursor-pointer mb-3">
                <span class="text-sm font-bold text-cyan-400">📁 1. Subir tu Imagen Base</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <!-- Botonera Mágica -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-2 scrollbar-hide">
                <button onclick="applyMagicCommand('/scrollstopper')" class="magic-btn">🛑 /scrollstopper</button>
                <button onclick="applyMagicCommand('/premiumshowcase')" class="magic-btn">✨ /premiumshowcase</button>
                <button onclick="applyMagicCommand('/sellwithoutselling')" class="magic-btn">🤝 /sellwithoutselling</button>
                <button onclick="applyMagicCommand('/meme')" class="magic-btn">😂 /meme</button>
            </div>

            <textarea id="aiPrompt" placeholder="Tocá un comando arriba o agregá detalles (Ej: /sellwithoutselling Enfocado en peluquerías)" class="w-full h-16 bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-cyan-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full mt-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold p-3 rounded-xl shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2 hover:from-cyan-500 hover:to-blue-500">
                <span id="btnText">✨ 2. Aplicar Magia (IA)</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <!-- Canvas HD -->
        <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
            <canvas id="mainCanvas"></canvas>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md p-4 border-t border-slate-800 z-40">
        <div class="max-w-md mx-auto">
            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-black text-sm hover:bg-slate-200 transition">
                📥 Descargar Placa Lista
            </button>
        </div>
    </div>

<script>
    let apiKey = localStorage.getItem('gesto_gemini_key') || '';
    
    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gesto_gemini_key', apiKey);
        toggleConfig();
    }

    const PRODUCT_CONTEXT = `CONTEXTO DEL PRODUCTO: "Gesto Smart" es un software ágil para comercios minoristas y mayoristas. Reemplaza Excel y libretas. Hace que gestionar stock y cobrar sea ultra fácil, sin interfaces pesadas.`;

    const magicPrompts = {
        '/scrollstopper': "Frenar el scroll. Gancho superior muy corto y polémico. CTA inferior: invitar a probar Gesto Smart. Oscurecimiento bajo (0.3). Fuente Bebas Neue.",
        '/premiumshowcase': "Percepción de alto valor. Copy elegante que asocie Gesto Smart con negocios de primer nivel. Oscurecimiento suave (0.2). Fuente Playfair Display.",
        '/sellwithoutselling': "Vender aportando valor. Gancho superior sobre el dolor de controlar stock a mano. CTA ofrece Gesto Smart como salida. Oscurece MUY poco (0.2). Fuente Montserrat.",
        '/meme': "Humor. Gancho superior 'POV: Cuando tienes que actualizar precios uno por uno...'. CTA: 'Mejor pasate a Gesto Smart'. Oscurecimiento (0.2). Fuente Montserrat."
    };

    function applyMagicCommand(command) {
        document.getElementById('aiPrompt').value = command;
    }

    const canvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true, backgroundColor: '#000' });
    canvas.setWidth(1080);
    canvas.setHeight(1920);
    let currentImageObj = null;

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                renderBaseImage(0);
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        canvas.clear();
        canvas.backgroundColor = '#000';

        const scale = Math.max(1080 / currentImageObj.width, 1920 / currentImageObj.height);
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: 540, top: 960,
            scaleX: scale, scaleY: scale
        });
        
        canvas.add(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: 1080, height: 1920,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
        }
        canvas.renderAll();
    }

    function clearOldTexts() {
        const objects = canvas.getObjects();
        const elementsToRemove = objects.filter(obj => obj.type === 'textbox' || obj.type === 'group');
        elementsToRemove.forEach(obj => canvas.remove(obj));
        canvas.renderAll();
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function generateWithAI() {
        let userInput = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Paso 1: Subí la imagen de fondo primero.');
        if (!userInput) return alert('Paso 2: Escribí una idea o usá un comando mágico.');
        if (!apiKey) {
            toggleConfig();
            return alert('Falta configurar tu API Key de Gemini.');
        }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        
        btn.disabled = true;
        btnText.innerText = "Pensando copy...";
        spinner.classList.remove('hidden');

        clearOldTexts();

        let hiddenContext = "";
        if (magicPrompts[userInput]) {
            hiddenContext = magicPrompts[userInput];
        } else {
            const possibleCommand = Object.keys(magicPrompts).find(cmd => userInput.startsWith(cmd));
            if(possibleCommand){
                hiddenContext = magicPrompts[possibleCommand] + " EXTRAS DEL USUARIO: " + userInput.replace(possibleCommand, "");
            } else {
                hiddenContext = "Instrucciones del usuario: " + userInput;
            }
        }

        const systemInstructions = `Eres un Copywriter Senior B2B. ${PRODUCT_CONTEXT}
        ESTRATEGIA: ${hiddenContext}
        Devuelve ÚNICAMENTE un objeto JSON válido, SIN markdown.
        JSON Requerido:
        {
            "ganchoSuperior": "Texto de impacto arriba",
            "llamadaInferior": "Texto de CTA abajo",
            "tipografia": "Bebas Neue", 
            "colorGancho": "Elige HEX: #FFFFFF (Blanco), #06b6d4 (Cyan) o #FDE047 (Amarillo)", 
            "colorFondoCTA": "Elige HEX: rgba(0,0,0,0.85) (Negro), #06b6d4 (Cyan) o #E11D48 (Rojo)",
            "nivelOscurecimiento": 0.2
        }
        (nivelOscurecimiento max 0.4). Combina bien los colores para que no sea monótono.`;

        const modelsToTry = ['gemini-3.6-flash', 'gemini-3.6-pro'];
        let success = false;
        let lastError = "";

        for (const model of modelsToTry) {
            let retries = 3;
            let retryWait = 3000;

            while (retries > 0 && !success) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemInstructions }] }]
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message);
                    
                    let textResponse = data.candidates[0].content.parts[0].text;
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    let aiResult = JSON.parse(textResponse);
                    aplicarDisenoIA(aiResult);
                    success = true;
                    break; 
                    
                } catch (error) {
                    if (error.message && (error.message.includes('demand') || error.message.includes('503'))) {
                        btnText.innerText = `Saturado. Reintento...`;
                        await delay(retryWait); 
                        retryWait += 3000; 
                        retries--;
                        lastError = "Servidores saturados.";
                    } else {
                        lastError = error.message;
                        break; 
                    }
                }
            }
            if (success) break; 
        }

        btn.disabled = false;
        btnText.innerText = "✨ 2. Aplicar Magia (IA)";
        spinner.classList.add('hidden');
        if (!success) alert(`Error: ${lastError}`);
    }

    function aplicarDisenoIA(config) {
        renderBaseImage(config.nivelOscurecimiento || 0.2);

        // 1. TEXTO DINÁMICO
        const textTop = new fabric.Textbox((config.ganchoSuperior || "").toUpperCase(), {
            left: 540, top: 200,
            originX: 'center', originY: 'top',
            width: 900,
            fontSize: config.tipografia === 'Bebas Neue' ? 120 : 80,
            fontFamily: config.tipografia || 'Montserrat',
            fontWeight: '900',
            fill: config.colorGancho || '#ffffff',
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 15, offsetX: 0, offsetY: 5 })
        });

        const isBgLight = config.colorFondoCTA === '#06b6d4' || config.colorFondoCTA === '#FDE047';
        
        const textBottom = new fabric.Textbox(config.llamadaInferior || "", {
            left: 540, top: 1700, 
            originX: 'center', originY: 'bottom',
            width: 900,
            fontSize: 45,
            fontFamily: 'Montserrat', 
            fontWeight: 'bold',
            fill: isBgLight ? '#000000' : '#ffffff',
            textAlign: 'center',
            backgroundColor: config.colorFondoCTA || 'rgba(0,0,0,0.85)',
            padding: 25,
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 })
        });

        // 2. LOGO VECTORIAL (Escalado al 25% y ajustado)
        const logoBg = new fabric.Rect({
            left: 0, top: 0,
            width: 320, height: 320,
            rx: 65, ry: 65, 
            fill: '#0d111c', 
            originX: 'center', originY: 'center'
        });

        const cyanBox = new fabric.Rect({
            left: 0, top: -45,
            width: 150, height: 150,
            rx: 35, ry: 35,
            fill: 'transparent',
            stroke: '#06b6d4',
            strokeWidth: 9,
            originX: 'center', originY: 'center'
        });

        const letterG = new fabric.Text('G', {
            left: -2, top: -45,
            fontFamily: 'Montserrat',
            fontWeight: '900',
            fontStyle: 'italic',
            fontSize: 90,
            fill: '#ffffff',
            originX: 'center', originY: 'center'
        });

        const dot = new fabric.Circle({
            left: 75, top: -120, 
            radius: 12,
            fill: '#06b6d4',
            originX: 'center', originY: 'center'
        });

        const textGesto = new fabric.Text('GESTO', {
            left: 0, top: 55,
            fontFamily: 'Montserrat',
            fontWeight: '300',
            fontSize: 48,
            fill: '#ffffff',
            originX: 'center', originY: 'center'
        });

        const textSmart = new fabric.Text('SMART', {
            left: 0, top: 105,
            fontFamily: 'Montserrat',
            fontWeight: '300',
            fontSize: 48,
            fill: '#ffffff',
            originX: 'center', originY: 'center'
        });

        // Agrupado y reducido al 25% de su tamaño original
        const logoGroup = new fabric.Group([logoBg, cyanBox, letterG, dot, textGesto, textSmart], {
            left: 960, top: 1810, // Posicionado bien en la esquina inferior derecha
            scaleX: 0.25, scaleY: 0.25, 
            originX: 'center', originY: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 }),
            selectable: true 
        });

        canvas.add(textTop);
        canvas.add(textBottom);
        canvas.add(logoGroup);

        canvas.renderAll();
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_Marca_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
