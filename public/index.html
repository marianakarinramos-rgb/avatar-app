<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contenido - IA Smart</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --primary: #101828;
            --accent: #007aff;
            --surface: #ffffff;
            --border: #eaecf0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05);
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
        .header p { font-size: 13px; color: #667085; }

        .content-body {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 14px; font-weight: 600; color: var(--primary); }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--accent); }

        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .preview-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .preview-box img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .preview-box span { font-size: 14px; font-weight: 500; color: #344054; }

        .controls {
            padding: 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:disabled { background: #98a2b3; cursor: not-allowed; }
        .btn:active:not(:disabled) { opacity: 0.8; }

        .success-screen {
            display: none;
            text-align: center;
            padding: 40px 24px;
            color: white;
            background: var(--primary);
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .success-screen h2 { font-size: 24px; }
        .success-screen p { font-size: 15px; color: #eaecf0; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Generador de Avatar Smart</h1>
        <p>Escribe el guion, elige tu foto y arma tu contenido.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>Seleccionar Foto Base del Avatar</label>
            <select id="photo-select">
                <option value="https://irbok2fr6ltfzhah.public.blob.vercel-storage.com/captures/front-1788449830122-xWGXVgh170CxCuJHvmT7S...jpg">Foto Oficial Principal (Gafas)</option>
                <option value="custom">Subir nueva foto al vuelo...</option>
            </select>
        </div>

        <div class="form-group" id="custom-file-group" style="display: none;">
            <label>Cargar Imagen de Rostro</label>
            <input type="file" id="custom-photo-file" accept="image/*">
        </div>

        <div class="form-group">
            <label>Escenario / Estilo de Video</label>
            <select id="scene-select">
                <option value="plaza">Caminando en la Plaza (Casual)</option>
                <option value="office">Oficina Tech / Minimalista</option>
                <option value="studio">Estudio Profesional</option>
            </select>
        </div>

        <div class="form-group">
            <label>Guion Comercial (Gesto Smart)</label>
            <textarea id="script-input" placeholder="Yo sé que cada vez que actualizas tardas horas... ¿cuánto pensás que tardas con catálogo lite?"></textarea>
        </div>
    </div>

    <div class="controls">
        <button id="generate-btn" class="btn">Generar Video Automático</button>
    </div>

    <div id="success-screen" class="success-screen">
        <h2>¡Contenido en Producción! 🚀</h2>
        <p>El motor de IA está procesando tu foto y sintetizando el guion.</p>
        <p>En unos minutos tendrás el video listo.</p>
    </div>
</div>

<script>
    const generateBtn = document.getElementById('generate-btn');
    const scriptInput = document.getElementById('script-input');
    const sceneSelect = document.getElementById('scene-select');
    const photoSelect = document.getElementById('photo-select');
    const customPhotoFile = document.getElementById('custom-photo-file');
    const customFileGroup = document.getElementById('custom-file-group');
    const successScreen = document.getElementById('success-screen');

    photoSelect.addEventListener('change', (e) => {
        if (e.target.value === 'custom') {
            customFileGroup.style.display = 'flex';
        } else {
            customFileGroup.style.display = 'none';
        }
    });

    generateBtn.addEventListener('click', async () => {
        const textScript = scriptInput.value.trim();
        const selectedScene = sceneSelect.value;
        const selectedPhoto = photoSelect.value;

        if (!textScript) {
            alert("Por favor, escribe un guion para que el avatar pueda hablar.");
            return;
        }

        generateBtn.disabled = true;
        generateBtn.innerText = "Procesando contenido...";

        try {
            let photoUrlToUse = selectedPhoto;

            // Si eligió subir una foto nueva al vuelo, la convertimos a base64 temporal
            if (selectedPhoto === 'custom' && customPhotoFile.files[0]) {
                const file = customPhotoFile.files[0];
                photoUrlToUse = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            }

            const response = await fetch('/api/generate-from-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    script: textScript,
                    scene: selectedScene,
                    photoUrl: photoUrlToUse
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                successScreen.style.display = 'flex';
            } else {
                throw new Error(result.error || "Error al procesar el guion");
            }
        } catch (error) {
            alert("Fallo el proceso: " + error.message);
            generateBtn.disabled = false;
            generateBtn.innerText = "Generar Video Automático";
        }
    });
</script>
</body>
</html>
