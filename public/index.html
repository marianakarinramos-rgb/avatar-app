<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IA Studio Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .canvas-wrapper { width: 100%; max-width: 400px; margin: 0 auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; transition: aspect-ratio 0.3s ease; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .magic-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .magic-btn:hover { background: #06b6d4; color: #0b0f19; border-color: #06b6d4; font-weight: bold; }
        
        .format-btn { flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; border: 1px solid #334155; color: #94a3b8; transition: all 0.2s; }
        .format-btn.active { background: #06b6d4; color: #0b0f19; border-color: #06b6d4; }
        
        .color-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: scale 0.1s; }
        .color-swatch:hover { scale: 1.1; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50">
        <div>
            <h1 class="text-base font-black text-white tracking-tight">GESTO SMART <span class="text-cyan-400">STUDIO</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl">⚙️</button>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
            <h2 class="font-bold text-lg mb-4 text-white">Motor IA (Gemini)</h2>
            <input type="password" id="apiKeyInput" placeholder="API Key..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-cyan-500">
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm hover:bg-slate-600">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-cyan-500 text-slate-900 p-3 rounded-lg font-bold text-sm hover:bg-cyan-400">Guardar</button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-4 mb-32 relative">
        
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 shadow-lg">
            
            <div class="flex gap-2 mb-3">
                <label class="flex-[3] bg-slate-800 hover:bg-slate-700 transition text-center p-3 rounded-xl border border-dashed border-slate-500 cursor-pointer flex items-center justify-center">
                    <span class="text-sm font-bold text-cyan-400">📁 Subir Fondo</span>
                    <input type="file" id="imageLoader" accept="image/*" class="hidden">
                </label>
                <button onclick="addFreeText()" class="flex-[1] bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl font-bold text-sm text-white flex items-center justify-center" title="Añadir Texto Libre">
                    T+
                </button>
            </div>

            <!-- Selector de Formato -->
            <div class="flex gap-2 mb-3">
                <div id="btnFormat916" onclick="setFormat('9:16')" class="format-btn active">📱 Story/Reel (9:16)</div>
                <div id="btnFormat11" onclick="setFormat('1:1')" class="format-btn">🔲 Post/Feed (1:1)</div>
            </div>

            <div class="flex gap-2 overflow-x-auto pb-2 mb-2 scrollbar-hide">
                <button onclick="applyMagicCommand('/scrollstopper')" class="magic-btn">🛑 /scrollstopper</button>
                <button onclick="applyMagicCommand('/premiumshowcase')" class="magic-btn">✨ /premiumshowcase</button>
                <button onclick="applyMagicCommand('/sellwithoutselling')" class="magic-btn">🤝 /sellwithoutselling</button>
                <button onclick="applyMagicCommand('/meme')" class="magic-btn">😂 /meme</button>
            </div>

            <textarea id="aiPrompt" placeholder="Comando o instrucción libre..." class="w-full h-16 bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-cyan-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full mt-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold p-3 rounded-xl shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2 hover:from-cyan-500 hover:to-blue-500">
                <span id="btnText">✨ Aplicar Magia (IA)</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <!-- Canvas HD con Panel Flotante de Edición -->
        <div class="relative">
            <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
                <canvas id="mainCanvas"></canvas>
            </div>

            <!-- Panel Flotante de Edición Textual (Oculto por defecto) -->
            <div id="editPanel" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 w-11/12 bg-slate-900/95 backdrop-blur-md border border-slate-700 p-3 rounded-xl shadow-2xl z-20 flex-col gap-3">
                <input type="text" id="textEditor" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-white outline-none focus:border-cyan-500" placeholder="Editar texto...">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2 flex-1 mr-4">
                        <span class="text-xs text-slate-400">Aa</span>
                        <input type="range" id="sizeSlider" min="20" max="150" value="80" class="w-full accent-cyan-500">
                    </div>
                    <div class="flex gap-2">
                        <div onclick="setTextColor('#FFFFFF')" class="color-swatch bg-white border-slate-400"></div>
                        <div onclick="setTextColor('#FDE047')" class="color-swatch bg-yellow-300"></div>
                        <div onclick="setTextColor('#06b6d4')" class="color-swatch bg-cyan-500"></div>
                        <div onclick="setTextColor('#000000')" class="color-swatch bg-black border-slate-600"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md p-4 border-t border-slate-800 z-40">
        <div class="max-w-md mx-auto">
            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-black text-sm hover:bg-slate-200 transition">
                📥 Descargar Render HD
            </button>
        </div>
    </div>

<script>
    // ==========================================
    // OVERRIDE CORE FABRIC.JS: Esquinas Redondeadas en Textbox
    // ==========================================
    fabric.Textbox.prototype._renderBackground = function(ctx) {
        if (!this.backgroundColor) return;
        var dim = this._getNonTransformedDimensions();
        ctx.fillStyle = this.backgroundColor;
        if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(-dim.x / 2, -dim.y / 2, dim.x, dim.y, 25);
            ctx.fill();
        } else {
            ctx.fillRect(-dim.x / 2, -dim.y / 2, dim.x, dim.y);
        }
    };
    // ==========================================

    let apiKey = localStorage.getItem('gesto_gemini_key') || '';
    let currentFormat = '9:16';
    let currentImageObj = null;

    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gesto_gemini_key', apiKey);
        toggleConfig();
    }

    const canvas = new fabric.Canvas('mainCanvas', { 
        preserveObjectStacking: true, 
        backgroundColor: '#000',
        selectionBorderColor: '#06b6d4',
        selectionCornerColor: '#06b6d4',
        cornerStyle: 'circle'
    });
    canvas.setWidth(1080);
    canvas.setHeight(1920);

    function setFormat(format) {
        currentFormat = format;
        const wrapper = document.getElementById('canvasWrapper');
        
        document.getElementById('btnFormat916').classList.remove('active');
        document.getElementById('btnFormat11').classList.remove('active');

        if (format === '9:16') {
            document.getElementById('btnFormat916').classList.add('active');
            canvas.setWidth(1080);
            canvas.setHeight(1920);
            wrapper.style.aspectRatio = '9/16';
        } else {
            document.getElementById('btnFormat11').classList.add('active');
            canvas.setWidth(1080);
            canvas.setHeight(1080);
            wrapper.style.aspectRatio = '1/1';
        }
        
        if (currentImageObj) {
            renderBaseImage(currentImageObj.lastOverlayOpacity || 0);
        }
        canvas.renderAll();
    }

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                renderBaseImage(0);
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        
        // Limpiamos la imagen anterior y el overlay
        const objects = canvas.getObjects();
        const bgs = objects.filter(obj => obj.type === 'image' || (obj.type === 'rect' && obj.fill && obj.fill.includes('rgba')));
        bgs.forEach(obj => canvas.remove(obj));

        currentImageObj.lastOverlayOpacity = overlayOpacity;

        const cw = canvas.getWidth();
        const ch = canvas.getHeight();
        
        // CORRECCIÓN CLAVE: Math.min ajusta la imagen para que encaje 100% sin cortes
        const scale = Math.min(cw / currentImageObj.width, ch / currentImageObj.height);
        
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: cw / 2, top: ch / 2,
            scaleX: scale, scaleY: scale,
            selectable: true, // Ahora podés arrastrar y ajustar el fondo a gusto
            evented: true,
            hasControls: true,
            hasBorders: true
        });
        
        canvas.add(currentImageObj);
        canvas.sendToBack(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: cw, height: ch,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
            // Aseguramos que el overlay quede detrás de los textos pero arriba de la imagen
            canvas.moveTo(overlay, 1);
        }
        canvas.renderAll();
    }

    const editPanel = document.getElementById('editPanel');
    const textEditor = document.getElementById('textEditor');
    const sizeSlider = document.getElementById('sizeSlider');

    canvas.on('selection:created', handleSelection);
    canvas.on('selection:updated', handleSelection);
    canvas.on('selection:cleared', function() { editPanel.classList.add('hidden'); });

    function handleSelection(e) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            editPanel.classList.remove('hidden');
            editPanel.classList.add('flex');
            textEditor.value = activeObj.text;
            sizeSlider.value = activeObj.fontSize;
        } else {
            editPanel.classList.add('hidden');
            editPanel.classList.remove('flex');
        }
    }

    textEditor.addEventListener('input', function() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set({ text: this.value });
            canvas.renderAll();
        }
    });

    sizeSlider.addEventListener('input', function() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set({ fontSize: parseInt(this.value) });
            canvas.renderAll();
        }
    });

    function setTextColor(hexCode) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set({ fill: hexCode });
            canvas.renderAll();
        }
    }

    function addFreeText() {
        const t = new fabric.Textbox("NUEVO TEXTO", {
            left: canvas.getWidth() / 2, top: canvas.getHeight() / 2,
            originX: 'center', originY: 'center',
            width: 800,
            fontSize: 70,
            fontFamily: 'Montserrat',
            fontWeight: '900',
            fill: '#ffffff',
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 15, offsetX: 0, offsetY: 5 }),
            padding: 20
        });
        canvas.add(t);
        canvas.setActiveObject(t);
        canvas.renderAll();
    }

    const PRODUCT_CONTEXT = `CONTEXTO: "Gesto Smart" software ágil de gestión/ventas para comercios.`;
    const magicPrompts = {
        '/scrollstopper': "Gancho polémico sobre perder plata. CTA invita a Gesto Smart. Oscurecimiento bajo (0.3). Fuente Bebas Neue.",
        '/premiumshowcase': "Copy elegante, alto valor. Oscurecimiento suave (0.2). Fuente Playfair Display.",
        '/sellwithoutselling': "Gancho sobre dolor de stock a mano. CTA ofrece Gesto Smart. Oscurece MUY poco (0.2). Fuente Montserrat.",
        '/meme': "Humor 'POV: actualizar precios a mano'. CTA a Gesto Smart. Oscurecimiento (0.2). Fuente Montserrat."
    };

    function applyMagicCommand(command) { document.getElementById('aiPrompt').value = command; }

    function clearOldTexts() {
        const objects = canvas.getObjects();
        const elementsToRemove = objects.filter(obj => obj.type === 'textbox' || obj.type === 'group');
        elementsToRemove.forEach(obj => canvas.remove(obj));
    }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function generateWithAI() {
        let userInput = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Subí la imagen de fondo primero.');
        if (!userInput) return alert('Escribí una idea o usá un comando.');
        if (!apiKey) { toggleConfig(); return alert('Falta tu API Key de Gemini.'); }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        btn.disabled = true; btnText.innerText = "Pensando copy..."; spinner.classList.remove('hidden');

        clearOldTexts();

        let hiddenContext = magicPrompts[userInput] || Object.keys(magicPrompts).reduce((acc, cmd) => userInput.startsWith(cmd) ? magicPrompts[cmd] + " EXTRAS: " + userInput.replace(cmd, "") : acc, "") || "Instrucciones: " + userInput;

        const systemInstructions = `Eres Copywriter B2B. ${PRODUCT_CONTEXT}
        ESTRATEGIA: ${hiddenContext}
        Devuelve ÚNICAMENTE un JSON válido, SIN markdown.
        JSON Requerido:
        {
            "ganchoSuperior": "Texto impacto",
            "llamadaInferior": "Texto CTA",
            "tipografia": "Bebas Neue", 
            "colorGancho": "HEX", 
            "colorFondoCTA": "rgba(0,0,0,0.85)",
            "nivelOscurecimiento": 0.2
        }`;

        const modelsToTry = ['gemini-3.6-flash', 'gemini-3.6-pro'];
        let success = false;
        let lastError = "";

        for (const model of modelsToTry) {
            let retries = 3;
            let retryWait = 2000;
            while (retries > 0 && !success) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: systemInstructions }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message);
                    let textResponse = data.candidates[0].content.parts[0].text;
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    let aiResult = JSON.parse(textResponse);
                    aplicarDisenoIA(aiResult);
                    success = true;
                    break; 
                } catch (error) {
                    if (error.message && (error.message.includes('demand') || error.message.includes('503'))) {
                        btnText.innerText = `Saturado. Reintento...`;
                        await delay(retryWait); retryWait += 2000; retries--;
                        lastError = "Servidores saturados.";
                    } else { lastError = error.message; break; }
                }
            }
            if (success) break; 
        }

        btn.disabled = false; btnText.innerText = "✨ Aplicar Magia (IA)"; spinner.classList.add('hidden');
        if (!success) alert(`Error: ${lastError}`);
    }

    function aplicarDisenoIA(config) {
        renderBaseImage(config.nivelOscurecimiento || 0.2);
        const cw = canvas.getWidth();
        const ch = canvas.getHeight();

        const textTop = new fabric.Textbox((config.ganchoSuperior || "").toUpperCase(), {
            left: cw / 2, top: ch * 0.15,
            originX: 'center', originY: 'top',
            width: cw * 0.85,
            fontSize: config.tipografia === 'Bebas Neue' ? 100 : 75,
            fontFamily: config.tipografia || 'Montserrat',
            fontWeight: '900',
            fill: config.colorGancho || '#ffffff',
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.9)', blur: 20, offsetX: 0, offsetY: 8 })
        });

        const isBgLight = config.colorFondoCTA === '#06b6d4' || config.colorFondoCTA === '#FDE047';
        const textBottom = new fabric.Textbox(config.llamadaInferior || "", {
            left: cw / 2, top: ch * 0.85, 
            originX: 'center', originY: 'bottom',
            width: cw * 0.85,
            fontSize: 45,
            fontFamily: 'Montserrat', 
            fontWeight: 'bold',
            fill: isBgLight ? '#000000' : '#ffffff',
            textAlign: 'center',
            backgroundColor: config.colorFondoCTA || 'rgba(0,0,0,0.85)',
            padding: 30, 
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.6)', blur: 15, offsetX: 0, offsetY: 10 })
        });

        const logoBg = new fabric.Rect({ left: 0, top: 0, width: 320, height: 320, rx: 65, ry: 65, fill: '#0d111c', originX: 'center', originY: 'center' });
        const cyanBox = new fabric.Rect({ left: 0, top: -45, width: 150, height: 150, rx: 35, ry: 35, fill: 'transparent', stroke: '#06b6d4', strokeWidth: 9, originX: 'center', originY: 'center' });
        const letterG = new fabric.Text('G', { left: -2, top: -45, fontFamily: 'Montserrat', fontWeight: '900', fontStyle: 'italic', fontSize: 90, fill: '#ffffff', originX: 'center', originY: 'center' });
        const dot = new fabric.Circle({ left: 75, top: -120, radius: 12, fill: '#06b6d4', originX: 'center', originY: 'center' });
        const textGesto = new fabric.Text('GESTO', { left: 0, top: 55, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        const textSmart = new fabric.Text('SMART', { left: 0, top: 105, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        
        const logoGroup = new fabric.Group([logoBg, cyanBox, letterG, dot, textGesto, textSmart], {
            left: cw - (cw * 0.1), top: ch - (ch * 0.05),
            scaleX: 0.20, scaleY: 0.20, 
            originX: 'center', originY: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 }),
            selectable: true 
        });

        canvas.add(textTop);
        canvas.add(textBottom);
        canvas.add(logoGroup);
        canvas.renderAll();
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_HQ_${currentFormat.replace(':','')}_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
