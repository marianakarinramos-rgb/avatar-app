<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart - Fábrica Express de Placas</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .header p { font-size: 12px; color: var(--text-muted); }

        .content-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }

        /* Selector de Estilos / Plantillas */
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .template-card {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .template-card.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }

        /* Vista Previa de la Placa (Formato vertical 9:16 simulado) */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 12;
            background: #000;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .preview-content {
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .preview-hook {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.3px;
        }

        .preview-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            align-self: center;
            letter-spacing: 1px;
        }

        .preview-brand {
            position: absolute;
            bottom: 14px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .controls {
            padding: 16px 20px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary {
            background: var(--surface-hover);
            color: white;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • Placas Express</h1>
        <p>Crea contenido de alto impacto visual sin editar videos.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>Gancho / Dolor del Cliente (Texto Principal)</label>
            <textarea id="script-input" placeholder="¿Cansada de actualizar precios a mano y quedarte sin stock a medianoche?">¿Cansada de actualizar precios a mano y quedarte sin stock a medianoche?</textarea>
        </div>

        <div class="form-group">
            <label>Elegir Estilo Visual</label>
            <div class="templates-grid">
                <div class="template-card active" data-style="dark">Dark Tech</div>
                <div class="template-card" data-style="vibrant">Vibrante</div>
                <div class="template-card" data-style="minimal">Minimal</div>
            </div>
        </div>

        <div class="form-group">
            <label>Vista Previa en Vivo (Formato Reel/TikTok)</label>
            <div id="preview-box" class="preview-container" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                <div class="preview-content">
                    <span id="badge-text" class="preview-badge" style="background: #38bdf8; color: #0b0f19;">Gesto Smart</span>
                    <h2 id="preview-text" class="preview-hook">¿Cansada de actualizar precios a mano y quedarte sin stock a medianoche?</h2>
                </div>
                <div id="brand-text" class="preview-brand">gestosmart.app</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="copy-text-btn" class="btn btn-secondary">Copiar Copy</button>
        <button id="download-plate-btn" class="btn">📸 Guardar Placa</button>
    </div>
</div>

<script>
    const scriptInput = document.getElementById('script-input');
    const previewText = document.getElementById('preview-text');
    const previewBox = document.getElementById('preview-box');
    const badgeText = document.getElementById('badge-text');
    const brandText = document.getElementById('brand-text');
    const templateCards = document.querySelectorAll('.template-card');
    const copyTextBtn = document.getElementById('copy-text-btn');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    let currentStyle = 'dark';

    // Estilos predefinidos para las placas
    const stylesConfig = {
        dark: {
            bg: 'linear-gradient(135deg, #090d16 0%, #172033 100%)',
            color: '#f8fafc',
            badgeBg: '#38bdf8',
            badgeColor: '#0b0f19',
            brandColor: '#94a3b8'
        },
        vibrant: {
            bg: 'linear-gradient(135deg, #f43f5e 0%, #7c2d12 100%)',
            color: '#ffffff',
            badgeBg: '#fef08a',
            badgeColor: '#7c2d12',
            brandColor: '#fed7aa'
        },
        minimal: {
            bg: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)',
            color: '#0f172a',
            badgeBg: '#0f172a',
            badgeColor: '#f8fafc',
            brandColor: '#64748b'
        }
    };

    // Actualizar texto en tiempo real
    scriptInput.addEventListener('input', (e) => {
        previewText.innerText = e.target.value || "Escribe tu texto arriba...";
    });

    // Cambiar estilo visual
    templateCards.forEach(card => {
        card.addEventListener('click', () => {
            templateCards.forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            currentStyle = card.getAttribute('data-style');
            
            const cfg = stylesConfig[currentStyle];
            previewBox.style.background = cfg.bg;
            previewBox.style.color = cfg.color;
            badgeText.style.background = cfg.badgeBg;
            badgeText.style.color = cfg.badgeColor;
            brandText.style.color = cfg.brandColor;
        });
    });

    // Copiar texto para usar de descripción en redes
    copyTextBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(scriptInput.value);
        copyTextBtn.innerText = "¡Copiado! ✅";
        setTimeout(() => copyTextBtn.innerText = "Copiar Copy", 2000);
    });

    // Acción para guardar / descargar (Aviso intuitivo para captura en celular)
    downloadPlateBtn.addEventListener('click', () => {
        alert("💡 Tip desde el celu: Hacé una captura de pantalla (screenshot) de la vista previa de arriba para recortar la placa perfecta y subirla de toque a tus historias o reels.");
    });
</script>
</body>
</html>
