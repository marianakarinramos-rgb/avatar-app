<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Fábrica Express de Placas</title>
    <!-- Librería para transformar el cuadro en archivo descargable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 17px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
        .header p { font-size: 12px; color: var(--text-muted); }

        .content-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .template-card {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .template-card.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }

        input[type="file"] {
            font-size: 12px;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-muted);
        }

        /* Vista Previa en Formato Reel/TikTok (9:16) */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 13;
            background: #000;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-bg-media {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .preview-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2;
            display: none;
        }

        .preview-content {
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .preview-hook {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .preview-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            align-self: center;
            letter-spacing: 1px;
            z-index: 3;
        }

        .preview-brand {
            position: absolute;
            bottom: 14px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.8;
            letter-spacing: 0.5px;
            z-index: 3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .controls {
            padding: 16px 20px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn:active { opacity: 0.8; }
        .btn-secondary { background: var(--surface-hover); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • Placas & Videos</h1>
        <p>Tu contenido listo para descargar en segundos.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>Gancho / Dolor del Cliente</label>
            <textarea id="script-input" placeholder="¿Cansada de actualizar precios a mano?">¿La agenda de papel? 😳 ! Y si pudieras tener una agenda en tu tablet o compu?</textarea>
        </div>

        <div class="form-group">
            <label>Fondo Base (Color o Archivo Multimedia)</label>
            <div class="templates-grid">
                <div class="template-card" data-style="dark">Dark Tech</div>
                <div class="template-card" data-style="vibrant">Vibrante</div>
                <div class="template-card" data-style="minimal">Minimal</div>
                <div class="template-card active" data-style="media">📁 Archivo</div>
            </div>
        </div>

        <div class="form-group" id="media-upload-group" style="display: flex;">
            <label>Subir Video o Imagen de Fondo</label>
            <input type="file" id="media-file-input" accept="image/*,video/*">
        </div>

        <div class="form-group">
            <label>Vista Previa Interactiva (Reel / TikTok)</label>
            <div id="preview-box" class="preview-container" style="background: #000;">
                <img id="bg-image" class="preview-bg-media" alt="Fondo">
                <video id="bg-video" class="preview-bg-media" autoplay muted loop playsinline></video>
                <div id="preview-overlay" class="preview-overlay" style="display: block;"></div>

                <span id="badge-text" class="preview-badge" style="background: #38bdf8; color: #0b0f19;">Gesto Smart</span>
                <div class="preview-content">
                    <h2 id="preview-text" class="preview-hook" style="color: #ffffff;">¿La agenda de papel? 😳 ! Y si pudieras tener una agenda en tu tablet o compu?</h2>
                </div>
                <div id="brand-text" class="preview-brand" style="color: #ffffff;">gestosmart.app</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="copy-text-btn" class="btn btn-secondary">Copiar Copy</button>
        <button id="download-plate-btn" class="btn">📥 Descargar Placa</button>
    </div>
</div>

<script>
    const scriptInput = document.getElementById('script-input');
    const previewText = document.getElementById('preview-text');
    const previewBox = document.getElementById('preview-box');
    const badgeText = document.getElementById('badge-text');
    const brandText = document.getElementById('brand-text');
    const templateCards = document.querySelectorAll('.template-card');
    const mediaUploadGroup = document.getElementById('media-upload-group');
    const mediaFileInput = document.getElementById('media-file-input');
    const bgImage = document.getElementById('bg-image');
    const bgVideo = document.getElementById('bg-video');
    const previewOverlay = document.getElementById('preview-overlay');
    const copyTextBtn = document.getElementById('copy-text-btn');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    let currentMode = 'media';

    const stylesConfig = {
        dark: { bg: 'linear-gradient(135deg, #090d16 0%, #172033 100%)', color: '#f8fafc', badgeBg: '#38bdf8', badgeColor: '#0b0f19', brandColor: '#94a3b8' },
        vibrant: { bg: 'linear-gradient(135deg, #f43f5e 0%, #7c2d12 100%)', color: '#ffffff', badgeBg: '#fef08a', badgeColor: '#7c2d12', brandColor: '#fed7aa' },
        minimal: { bg: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)', color: '#0f172a', badgeBg: '#0f172a', badgeColor: '#f8fafc', brandColor: '#64748b' }
    };

    scriptInput.addEventListener('input', (e) => {
        previewText.innerText = e.target.value || "Escribe tu texto...";
    });

    templateCards.forEach(card => {
        card.addEventListener('click', () => {
            templateCards.forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            currentMode = card.getAttribute('data-style');

            if (currentMode === 'media') {
                mediaUploadGroup.style.display = 'flex';
                previewOverlay.style.display = 'block';
                previewText.style.color = '#ffffff';
                brandText.style.color = '#ffffff';
                previewBox.style.background = '#000';
            } else {
                mediaUploadGroup.style.display = 'none';
                bgImage.style.display = 'none';
                bgVideo.style.display = 'none';
                previewOverlay.style.display = 'none';

                const cfg = stylesConfig[currentMode];
                previewBox.style.background = cfg.bg;
                previewText.style.color = cfg.color;
                badgeText.style.background = cfg.badgeBg;
                badgeText.style.color = cfg.badgeColor;
                brandText.style.color = cfg.brandColor;
            }
        });
    });

    mediaFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        previewOverlay.style.display = 'block';
        previewText.style.color = '#ffffff';
        brandText.style.color = '#ffffff';

        if (file.type.startsWith('video')) {
            bgImage.style.display = 'none';
            bgVideo.src = fileURL;
            bgVideo.style.display = 'block';
            bgVideo.play();
        } else if (file.type.startsWith('image')) {
            bgVideo.style.display = 'none';
            bgImage.src = fileURL;
            bgImage.style.display = 'block';
        }
    });

    copyTextBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(scriptInput.value);
        copyTextBtn.innerText = "¡Copiado! ✅";
        setTimeout(() => copyTextBtn.innerText = "Copiar Copy", 2000);
    });

    // Acción real de descarga de la placa en alta calidad
    downloadPlateBtn.addEventListener('click', async () => {
        downloadPlateBtn.innerText = "Generando imagen...";
        downloadPlateBtn.disabled = true;

        try {
            // Ocultamos temporalmente los bordes o elementos si es necesario y tomamos la captura
            const canvas = await html2canvas(previewBox, {
                useCORS: true,
                scale: 2 // Alta definición
            });

            const imageURI = canvas.toDataURL("image/png");
            
            // Creamos un link invisible para forzar la descarga en el celular o PC
            const link = document.createElement('a');
            link.href = imageURI;
            link.download = `gesto-smart-placa-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            downloadPlateBtn.innerText = "¡Descargado! 📥";
        } catch (error) {
            alert("Error al descargar: " + error.message);
            downloadPlateBtn.innerText = "📥 Descargar Placa";
        } finally {
            setTimeout(() => {
                downloadPlateBtn.innerText = "📥 Descargar Placa";
                downloadPlateBtn.disabled = false;
            }, 2500);
        }
    });
</script>
</body>
</html>
