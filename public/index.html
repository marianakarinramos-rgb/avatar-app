<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Campaign Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .canvas-wrapper { width: 100%; height: auto; position: relative; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9); border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .magic-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 12px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: bold; width: 100%; }
        .magic-btn:hover { background: #06b6d4; color: #0b0f19; border-color: #06b6d4; }
        
        .command-item { cursor: pointer; transition: all 0.2s; }
        .command-item:hover { background-color: #1e293b; border-left: 3px solid #06b6d4; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900 z-10 shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black text-white tracking-tight">GESTO SMART <span class="text-cyan-400">STUDIO</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl">⚙️</button>
    </header>

    <!-- Modal API -->
    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
            <h2 class="font-bold text-lg mb-4 text-white">Conexión API (Gemini)</h2>
            <input type="password" id="apiKeyInput" placeholder="Pega tu API Key..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-cyan-500">
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm hover:bg-slate-600">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-cyan-500 text-slate-900 p-3 rounded-lg font-bold text-sm hover:bg-cyan-400">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Directorio 99 Prompts -->
    <div id="promptModal" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col p-4 backdrop-blur-md">
        <div class="max-w-2xl w-full mx-auto flex flex-col h-full bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden mt-10 mb-10">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h2 class="font-bold text-white text-lg">📚 Directorio de 99 Comandos Estratégicos</h2>
                <button onclick="togglePromptModal()" class="text-slate-400 hover:text-white font-bold text-2xl">✕</button>
            </div>
            <div class="p-4 bg-slate-900">
                <input type="text" id="promptSearch" onkeyup="filterPrompts()" placeholder="Buscar comando... (ej: tiktok, ceo, dolor)" class="w-full bg-slate-800 border border-slate-700 p-4 rounded-xl text-base text-white outline-none focus:border-cyan-500">
            </div>
            <div id="promptList" class="flex-1 overflow-y-auto p-2 scrollbar-hide grid grid-cols-2 gap-2">
                <!-- Se inyecta JS -->
            </div>
        </div>
    </div>

    <!-- Layout Principal: 3 Columnas -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- COLUMNA IZQUIERDA: Herramientas -->
        <aside class="w-80 flex flex-col gap-4 p-4 border-r border-slate-800 bg-slate-900/30 overflow-y-auto scrollbar-hide shrink-0">
            
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Configuración Visual</h2>
            
            <label class="w-full bg-slate-800 hover:bg-slate-700 transition text-center p-4 rounded-xl border-2 border-dashed border-slate-500 cursor-pointer flex items-center justify-center gap-2 shadow-sm">
                <span class="text-base font-bold text-cyan-400">📁 Subir Captura Base</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <div class="grid grid-cols-1 gap-3">
                <select id="globalFont" class="bg-slate-950 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none focus:border-cyan-500 cursor-pointer">
                    <option value="Playfair Display">Fuente: Playfair Display</option>
                    <option value="Montserrat">Fuente: Montserrat</option>
                    <option value="Cinzel">Fuente: Cinzel</option>
                </select>
                <select id="globalFormat" class="bg-slate-950 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none focus:border-cyan-500 cursor-pointer" onchange="setFormat(this.value)">
                    <option value="9:16">Formato: Story/Reel (Vertical)</option>
                    <option value="1:1">Formato: Post (Cuadrado)</option>
                </select>
            </div>

            <hr class="border-slate-800 my-2">

            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Estrategia de Campaña</h2>

            <button onclick="togglePromptModal()" class="w-full bg-cyan-950 border border-cyan-800 text-cyan-100 hover:bg-cyan-900 font-bold p-3 rounded-xl transition flex justify-center items-center gap-2">
                📚 Explorar 99 Comandos
            </button>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="applyMagicCommand('/dolor')" class="magic-btn">🛑 Dolor</button>
                <button onclick="applyMagicCommand('/beneficio')" class="magic-btn">✨ Beneficio</button>
            </div>

            <textarea id="aiPrompt" placeholder="Escribí de qué trata la campaña o seleccioná un comando arriba..." class="w-full flex-1 min-h-[120px] bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-cyan-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold p-4 rounded-xl shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2 hover:from-cyan-500 hover:to-blue-500 transition mt-auto">
                <span id="btnText">✨ Crear Campaña</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </aside>

        <!-- COLUMNA CENTRAL: Lienzo (Canvas) -->
        <section class="flex-1 flex flex-col items-center justify-center bg-slate-950 p-6 overflow-hidden relative">
            <div id="canvasWrapper" class="canvas-wrapper w-full max-h-full" style="aspect-ratio: 9/16; max-width: calc(100vh * (9/16));">
                <!-- Se inyecta un canvas del 100% del padre -->
                <canvas id="mainCanvas"></canvas>
            </div>
            
            <!-- Panel Flotante Minimalista de Edición -->
            <div id="editPanel" class="hidden absolute bottom-6 w-full max-w-md bg-slate-900/90 backdrop-blur-md border border-slate-700 p-3 rounded-2xl shadow-2xl z-20 flex-col gap-3">
                <input type="text" id="textEditor" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-white outline-none focus:border-cyan-500 font-bold" placeholder="Editar texto...">
                <div class="flex items-center gap-4 px-2">
                    <span class="text-xs font-bold text-slate-400">Tamaño</span>
                    <input type="range" id="sizeSlider" min="20" max="150" value="80" class="flex-1 accent-cyan-500">
                </div>
            </div>
        </section>

        <!-- COLUMNA DERECHA: Resultados & Copy -->
        <aside class="w-80 flex flex-col gap-4 p-4 border-l border-slate-800 bg-slate-900/30 overflow-y-auto shrink-0">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Exportar</h2>
            
            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 font-black p-4 rounded-xl shadow-md hover:bg-slate-200 transition flex justify-center items-center gap-2">
                📥 Descargar Placa HD
            </button>

            <hr class="border-slate-800 my-2">

            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Copy para Redes Sociales</h2>
            
            <div class="flex-1 flex flex-col">
                <textarea id="socialCaption" readonly placeholder="Aquí aparecerá el texto persuasivo listo para copiar..." class="w-full flex-1 bg-slate-950 border border-slate-800 p-4 rounded-xl text-sm text-slate-300 outline-none resize-none leading-relaxed"></textarea>
                <button onclick="copyCaption()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-white font-bold p-3 rounded-xl transition flex justify-center items-center gap-2 border border-slate-700">
                    📋 Copiar Texto
                </button>
            </div>
        </aside>

    </main>

<script>
    let apiKey = localStorage.getItem('gesto_gemini_key') || '';
    let currentFormat = '9:16';
    let currentImageObj = null;

    // Directorio
    const promptDictionary = {
        "/humano": "Escritura natural", "/experto": "Nivel de especialista", "/ceo": "Mentalidad de fundador",
        "/viral": "Alto impacto", "/seo": "Optimizado para SEO", "/maestro": "Explica fácil", "/el5": "Como a un niño",
        "/resumen": "Corto y directo", "/redactor": "Copywriting B2B", "/brainstorm": "Ideas creativas",
        "/stepbystep": "Paso a paso", "/proscons": "Ventajas/Desventajas", "/decision": "Mejor decisión",
        "/planner": "Plan de acción", "/productivity": "Mejora procesos", "/time": "Gestión de tiempo",
        "/casual": "Conversacional", "/friendly": "Cálido", "/persuasive": "Convincente", "/concise": "Ve al grano",
        "/storyteller": "Cuenta historia", "/hook": "Ganchos visuales", "/headline": "Titulares",
        "/linkedin": "LinkedIn B2B", "/instagram": "Instagram aesthetic", "/reels": "Ideas Reels",
        "/sales": "Cerrar ventas", "/offer": "Oferta irresistible", "/customer": "Dolor del cliente",
        "/growth": "Hacks rápidos", "/calendar": "Calendario post", "/ideas": "Disruptivo",
        "/contrarian": "Pensamiento opuesto", "/assumptions": "Rompe supuestos", "/rootcause": "Problema raíz",
        "/solution": "Solución rápida", "/automatizar": "Sin manual", "/simulacion": "Simula usuario"
    };

    function initPromptDictionary() {
        const list = document.getElementById('promptList');
        list.innerHTML = '';
        Object.keys(promptDictionary).forEach(key => {
            const div = document.createElement('div');
            div.className = 'command-item p-3 border border-slate-800 rounded-lg text-sm bg-slate-950 flex flex-col gap-1';
            div.innerHTML = `<span class="font-black text-cyan-400 text-base">${key}</span><span class="text-slate-400 text-xs">${promptDictionary[key]}</span>`;
            div.onclick = () => {
                const currentVal = document.getElementById('aiPrompt').value;
                document.getElementById('aiPrompt').value = `${key} ${currentVal.replace(/^\/\w+\s*/, '')}`.trim();
                togglePromptModal();
            };
            list.appendChild(div);
        });
    }

    function filterPrompts() {
        const input = document.getElementById('promptSearch').value.toLowerCase();
        const items = document.querySelectorAll('.command-item');
        items.forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(input) ? "flex" : "none";
        });
    }

    function togglePromptModal() {
        const modal = document.getElementById('promptModal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) document.getElementById('promptSearch').focus();
    }

    window.onload = initPromptDictionary;

    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gesto_gemini_key', apiKey);
        toggleConfig();
    }

    const canvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true, backgroundColor: '#000' });
    
    // Función para redimensionar el canvas real dentro del wrapper visual
    function resizeCanvas() {
        const wrapper = document.getElementById('canvasWrapper');
        canvas.setWidth(1080);
        if (currentFormat === '9:16') {
            canvas.setHeight(1920);
            wrapper.style.aspectRatio = '9/16';
            wrapper.style.maxWidth = 'calc(100vh * (9/16))';
        } else {
            canvas.setHeight(1080);
            wrapper.style.aspectRatio = '1/1';
            wrapper.style.maxWidth = 'calc(100vh * (1/1))';
        }
        canvas.setZoom(1); // El css object-fit se encarga del escalado visual
        if (currentImageObj) renderBaseImage(currentImageObj.lastOverlayOpacity || 0.4);
    }

    function setFormat(format) {
        currentFormat = format;
        resizeCanvas();
    }
    
    window.addEventListener('resize', resizeCanvas);

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                resizeCanvas();
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        canvas.clear();
        currentImageObj.lastOverlayOpacity = overlayOpacity;

        const cw = canvas.getWidth();
        const ch = canvas.getHeight();
        const scale = Math.min(cw / currentImageObj.width, ch / currentImageObj.height);
        
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: cw / 2, top: ch / 2,
            scaleX: scale, scaleY: scale,
            selectable: true, hasControls: true
        });
        
        canvas.add(currentImageObj);
        canvas.sendToBack(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: cw, height: ch,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
            canvas.moveTo(overlay, 1);
        }
        canvas.renderAll();
    }

    const editPanel = document.getElementById('editPanel');
    const textEditor = document.getElementById('textEditor');
    const sizeSlider = document.getElementById('sizeSlider');

    canvas.on('selection:created', handleSelection);
    canvas.on('selection:updated', handleSelection);
    canvas.on('selection:cleared', function() { editPanel.classList.add('hidden'); });

    function handleSelection() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            editPanel.classList.remove('hidden');
            editPanel.classList.add('flex');
            textEditor.value = activeObj.text;
            sizeSlider.value = activeObj.fontSize;
        } else {
            editPanel.classList.add('hidden');
            editPanel.classList.remove('flex');
        }
    }

    textEditor.addEventListener('input', function() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set({ text: this.value });
            canvas.renderAll();
        }
    });

    sizeSlider.addEventListener('input', function() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set({ fontSize: parseInt(this.value) });
            canvas.renderAll();
        }
    });

    function applyMagicCommand(command) { document.getElementById('aiPrompt').value = command; }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function generateWithAI() {
        let userInput = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Primero subí una captura del sistema.');
        if (!userInput) return alert('Escribí de qué trata la campaña.');
        if (!apiKey) { toggleConfig(); return alert('Falta tu API Key de Gemini.'); }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        btn.disabled = true; btnText.innerText = "Creando..."; spinner.classList.remove('hidden');

        canvas.getObjects().filter(obj => obj.type === 'textbox' || obj.type === 'group').forEach(obj => canvas.remove(obj));

        let extractedCommand = Object.keys(promptDictionary).find(cmd => userInput.toLowerCase().startsWith(cmd));
        let strategyContext = userInput;
        if (extractedCommand) {
            let instructionClean = userInput.slice(extractedCommand.length).trim();
            strategyContext = `Enfoque: [${promptDictionary[extractedCommand]}]. Objetivo: ${instructionClean}`;
        }

        const PRODUCT_CONTEXT = `Gesto Smart: App B2B ágil, gestión stock/ventas, sin fricción.`;

        const systemInstructions = `Eres Marketer Senior B2B. ${PRODUCT_CONTEXT}
        ESTRATEGIA: ${strategyContext}
        
        Genera:
        1. "fraseBomba": Visual, directa, frenar scroll (max 6 palabras).
        2. "copyInstagram": Texto post (emojis, espacios, hashtags).
        3. "paletaElegida": Aleatorio de 1 a 4.
        
        Retorna JSON puro:
        {
            "fraseBomba": "Texto corto",
            "copyInstagram": "Texto largo post...",
            "paletaElegida": 2,
            "nivelOscurecimiento": 0.5
        }`;

        // CONEXIÓN SÓLIDA - Nombres base oficiales
        const modelsToTry = ['gemini-1.5-flash'];
        let success = false;
        let lastError = "";

        for (const model of modelsToTry) {
            let retries = 2;
            while (retries > 0 && !success) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: systemInstructions }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || "Error API");
                    
                    let textResponse = data.candidates[0].content.parts[0].text;
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    let aiResult = JSON.parse(textResponse);
                    
                    aplicarCampanaIA(aiResult);
                    success = true;
                    break; 
                } catch (error) {
                    lastError = error.message;
                    await delay(3000); 
                    retries--;
                }
            }
            if (success) break; 
        }

        btn.disabled = false; btnText.innerText = "✨ Crear Campaña"; spinner.classList.add('hidden');
        if (!success) alert(`Error: ${lastError}`);
    }

    function aplicarCampanaIA(config) {
        document.getElementById('socialCaption').value = config.copyInstagram;

        renderBaseImage(config.nivelOscurecimiento || 0.5);
        const cw = canvas.getWidth();
        const ch = canvas.getHeight();
        const fontToUse = document.getElementById('globalFont').value;
        const isSerif = fontToUse === 'Playfair Display' || fontToUse === 'Cinzel';

        let fillColor = '#ffffff';
        if(config.paletaElegida == 2) fillColor = '#FEF08A'; 
        if(config.paletaElegida == 3) fillColor = '#FBCFE8'; 
        if(config.paletaElegida == 4) fillColor = '#4ade80'; 

        const textBomb = new fabric.Textbox((config.fraseBomba || "").toUpperCase(), {
            left: cw / 2, top: ch / 2,
            originX: 'center', originY: 'center',
            width: cw * 0.90,
            fontSize: isSerif ? 100 : 85,
            fontFamily: fontToUse,
            fontWeight: isSerif ? '700' : '900',
            fontStyle: fontToUse === 'Playfair Display' ? 'italic' : 'normal',
            fill: fillColor,
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.95)', blur: 30, offsetX: 0, offsetY: 10 }),
            lineHeight: 1.1
        });

        const logoBg = new fabric.Rect({ left: 0, top: 0, width: 320, height: 320, rx: 65, ry: 65, fill: '#0d111c', originX: 'center', originY: 'center' });
        const cyanBox = new fabric.Rect({ left: 0, top: -45, width: 150, height: 150, rx: 35, ry: 35, fill: 'transparent', stroke: '#06b6d4', strokeWidth: 9, originX: 'center', originY: 'center' });
        const letterG = new fabric.Text('G', { left: -2, top: -45, fontFamily: 'Montserrat', fontWeight: '900', fontStyle: 'italic', fontSize: 90, fill: '#ffffff', originX: 'center', originY: 'center' });
        const dot = new fabric.Circle({ left: 75, top: -120, radius: 12, fill: '#06b6d4', originX: 'center', originY: 'center' });
        const textGesto = new fabric.Text('GESTO', { left: 0, top: 55, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        const textSmart = new fabric.Text('SMART', { left: 0, top: 105, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        
        const logoGroup = new fabric.Group([logoBg, cyanBox, letterG, dot, textGesto, textSmart], {
            left: cw - (cw * 0.12), top: ch - (ch * 0.08),
            scaleX: 0.20, scaleY: 0.20, 
            originX: 'center', originY: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 }),
            selectable: true 
        });

        canvas.add(textBomb);
        canvas.add(logoGroup);
        canvas.renderAll();
        resizeCanvas(); // Asegura ajuste tras render
    }

    function copyCaption() {
        const copyText = document.getElementById("socialCaption");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
