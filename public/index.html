<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Fábrica Express de Placas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { padding: 16px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 16px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 11px; color: var(--text-muted); }

        .content-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .template-card {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
        }
        .template-card.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.05);
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .pos-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .pos-btn.active {
            background: var(--primary);
            color: #0b0f19;
            border-color: var(--primary);
        }

        input[type="file"] {
            font-size: 11px;
            padding: 6px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
        }

        /* Vista Previa en Formato Reel/TikTok estricto (9:16) con fondo prolijo */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #0f172a;
            border-radius: 10px;
            display: flex;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            justify-content: center;
            align-items: center;
        }

        /* Contenedor de la imagen respetando proporciones (Adiós efecto salchicha) */
        .preview-bg-media {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* ¡Mantiene la forma original de tu imagen sin deformarla ni recortarla! */
            z-index: 1;
            display: none;
        }

        .preview-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
            display: none;
        }

        .preview-content-box {
            position: absolute;
            width: 90%;
            padding: 14px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .pos-top { top: 16px; align-items: flex-start; text-align: left; }
        .pos-center { top: 50%; transform: translateY(-50%); align-items: center; text-align: center; }
        .pos-bottom { bottom: 16px; align-items: center; text-align: center; }

        .preview-hook {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            color: #ffffff;
        }

        .preview-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 15px;
            letter-spacing: 1px;
            background: var(--primary);
            color: #0b0f19;
        }

        .preview-brand {
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 9px;
            font-weight: 600;
            opacity: 0.7;
            z-index: 3;
            color: #ffffff;
        }

        .controls {
            padding: 12px 16px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .btn-secondary { background: var(--surface-hover); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • Placas Pro</h1>
        <p>Formato vertical óptimo para Instagram y TikTok.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>Texto / Gancho Comercial</label>
            <textarea id="script-input" placeholder="Escribe aquí tu gancho...">¿La agenda de papel? 😳 ! Y si pudieras tener una agenda en tu tablet o compu?</textarea>
        </div>

        <div class="form-group">
            <label>Posición del Texto</label>
            <div class="position-grid">
                <button class="pos-btn" data-pos="top">Arriba</button>
                <button class="pos-btn" data-pos="center">Centro</button>
                <button class="pos-btn active" data-pos="bottom">Abajo</button>
            </div>
        </div>

        <div class="form-group">
            <label>Fondo Base (Color o Imagen)</label>
            <div class="templates-grid">
                <div class="template-card" data-style="dark">Dark</div>
                <div class="template-card" data-style="vibrant">Vibrante</div>
                <div class="template-card" data-style="minimal">Minimal</div>
                <div class="template-card active" data-style="media">📁 Imagen</div>
            </div>
        </div>

        <div class="form-group" id="media-upload-group" style="display: flex;">
            <label>Subir Imagen (Se adapta sin deformarse)</label>
            <input type="file" id="media-file-input" accept="image/*">
        </div>

        <div class="form-group">
            <label>Vista Previa (Formato 9:16 Redes)</label>
            <div id="preview-box" class="preview-container">
                <img id="bg-image" class="preview-bg-media" alt="Fondo">
                <div id="preview-overlay" class="preview-overlay" style="display: block;"></div>

                <div id="content-box" class="preview-content-box pos-bottom">
                    <span id="badge-text" class="preview-badge">Gesto Smart</span>
                    <h2 id="preview-text" class="preview-hook">¿La agenda de papel? 😳 ! Y si pudieras tener una agenda en tu tablet o compu?</h2>
                </div>
                <div id="brand-text" class="preview-brand">gestosmart.app</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="copy-text-btn" class="btn btn-secondary">Copiar Copy</button>
        <button id="download-plate-btn" class="btn">📥 Descargar Placa</button>
    </div>
</div>

<script>
    const scriptInput = document.getElementById('script-input');
    const previewText = document.getElementById('preview-text');
    const previewBox = document.getElementById('preview-box');
    const badgeText = document.getElementById('badge-text');
    const contentBox = document.getElementById('content-box');
    const templateCards = document.querySelectorAll('.template-card');
    const posButtons = document.querySelectorAll('.pos-btn');
    const mediaUploadGroup = document.getElementById('media-upload-group');
    const mediaFileInput = document.getElementById('media-file-input');
    const bgImage = document.getElementById('bg-image');
    const previewOverlay = document.getElementById('preview-overlay');
    const copyTextBtn = document.getElementById('copy-text-btn');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    let currentMode = 'media';
    let currentPos = 'bottom';

    const stylesConfig = {
        dark: { bg: 'linear-gradient(135deg, #090d16 0%, #172033 100%)', color: '#f8fafc' },
        vibrant: { bg: 'linear-gradient(135deg, #f43f5e 0%, #7c2d12 100%)', color: '#ffffff' },
        minimal: { bg: 'linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)', color: '#0f172a' }
    };

    scriptInput.addEventListener('input', (e) => {
        previewText.innerText = e.target.value || "Escribe tu texto...";
    });

    posButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            posButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentPos = btn.getAttribute('data-pos');
            contentBox.className = `preview-content-box pos-${currentPos}`;
        });
    });

    templateCards.forEach(card => {
        card.addEventListener('click', () => {
            templateCards.forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            currentMode = card.getAttribute('data-style');

            if (currentMode === 'media') {
                mediaUploadGroup.style.display = 'flex';
                previewOverlay.style.display = 'block';
                previewBox.style.background = '#0f172a';
            } else {
                mediaUploadGroup.style.display = 'none';
                bgImage.style.display = 'none';
                previewOverlay.style.display = 'none';

                const cfg = stylesConfig[currentMode];
                previewBox.style.background = cfg.bg;
                previewText.style.color = cfg.color;
            }
        });
    });

    mediaFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileURL = URL.createObjectURL(file);
        previewOverlay.style.display = 'block';
        bgImage.src = fileURL;
        bgImage.style.display = 'block';
    });

    copyTextBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(scriptInput.value);
        copyTextBtn.innerText = "¡Copiado! ✅";
        setTimeout(() => copyTextBtn.innerText = "Copiar Copy", 2000);
    });

    downloadPlateBtn.addEventListener('click', async () => {
        downloadPlateBtn.innerText = "Armando placa...";
        downloadPlateBtn.disabled = true;

        try {
            await new Promise(r => setTimeout(r, 1000));

            const canvas = await html2canvas(previewBox, {
                useCORS: true,
                scale: 3
            });

            const imageURI = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = imageURI;
            link.download = `gesto-smart-story-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            downloadPlateBtn.innerText = "¡Lista en tu celu! 📥";
        } catch (error) {
            alert("Error al descargar: " + error.message);
            downloadPlateBtn.innerText = "📥 Descargar Placa";
        } finally {
            setTimeout(() => {
                downloadPlateBtn.innerText = "📥 Descargar Placa";
                downloadPlateBtn.disabled = false;
            }, 2500);
        }
    });
</script>
</body>
</html>
