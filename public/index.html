<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IG Story Studio Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }

        .header { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 11px; color: var(--text-muted); }

        .content-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 78vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

        textarea {
            width: 100%;
            height: 55px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        select, input[type="file"], input[type="color"] {
            width: 100%;
            padding: 7px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 11px;
            outline: none;
        }

        /* Vista Previa 9:16 Pantalla Completa sin espacios negros */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* Imagen de fondo que llena el 100% de la pantalla sin franjas */
        .preview-bg-media {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .preview-bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        /* Tarjetas de texto flotantes sobre la imagen */
        .story-text-card {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
        }

        .style-classic {
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .style-neon {
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .style-raw {
            background: transparent;
            text-shadow: 0 2px 8px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.9);
        }

        .story-text-content {
            font-size: 14px;
            line-height: 1.35;
            word-break: break-word;
            font-weight: 700;
        }

        .story-footer {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            z-index: 10;
        }

        .ig-sticker {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0b0f19;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .controls {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • IG Story Studio</h1>
        <p>Pantalla completa real sin espacios vacíos.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>📝 Texto Superior (Dejar vacío si no se usa)</label>
            <textarea id="input-main" placeholder="¿Cuánto tardás en hacer el catálogo? 😳">¿Cuánto tardás en hacer el catálogo? 😳</textarea>
        </div>

        <div class="form-group">
            <label>💬 Texto Inferior (Dejar vacío si no se usa)</label>
            <textarea id="input-sub" placeholder="Subí un excel y la magia ocurre sola 🚀"></textarea>
        </div>

        <div class="row-options">
            <div class="form-group">
                <label>Estilo de Tarjeta</label>
                <select id="card-style-select">
                    <option value="style-classic">Caja Clásica IG (Oscura)</option>
                    <option value="style-neon">Caja Neón Pro</option>
                    <option value="style-raw">Texto Libre (Sin Caja)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color de Tipografía</label>
                <input type="color" id="text-color-picker" value="#ffffff">
            </div>
        </div>

        <div class="form-group">
            <label>Subir Imagen o Captura de Tienda</label>
            <input type="file" id="media-file-input" accept="image/*,video/*">
        </div>

        <div class="form-group">
            <label>Vista Previa Interactiva</label>
            <div id="preview-box" class="preview-container">
                <!-- Imagen de fondo a pantalla completa -->
                <img id="bg-image" class="preview-bg-media" alt="Fondo">
                <video id="bg-video" class="preview-bg-video" autoplay muted loop playsinline></video>

                <!-- Bloque Superior -->
                <div id="box-main" class="story-text-card style-classic">
                    <p id="text-main" class="story-text-content" style="color: #ffffff;">¿Cuánto tardás en hacer el catálogo? 😳</p>
                </div>

                <!-- Bloque Inferior + Sello -->
                <div style="width: 100%; display: flex; flex-direction: column; gap: 6px; z-index: 10;">
                    <div id="box-sub" class="story-text-card style-classic" style="display: none;">
                        <p id="text-sub" class="story-text-content" style="color: #ffffff;"></p>
                    </div>
                    <div class="story-footer">
                        <div class="ig-sticker">gestosmart.app</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="download-plate-btn" class="btn">📥 Descargar Historia Pro</button>
    </div>
</div>

<script>
    const inputMain = document.getElementById('input-main');
    const inputSub = document.getElementById('input-sub');
    const textMain = document.getElementById('text-main');
    const textSub = document.getElementById('text-sub');
    const boxMain = document.getElementById('box-main');
    const boxSub = document.getElementById('box-sub');
    const cardStyleSelect = document.getElementById('card-style-select');
    const textColorPicker = document.getElementById('text-color-picker');
    const mediaFileInput = document.getElementById('media-file-input');
    const bgImage = document.getElementById('bg-image');
    const bgVideo = document.getElementById('bg-video');
    const previewBox = document.getElementById('preview-box');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    inputMain.addEventListener('input', (e) => {
        textMain.innerText = e.target.value;
        boxMain.style.display = e.target.value.trim() ? 'block' : 'none';
    });

    inputSub.addEventListener('input', (e) => {
        textSub.innerText = e.target.value;
        boxSub.style.display = e.target.value.trim() ? 'block' : 'none';
    });

    // Inicializar estado de las cajas según texto por defecto
    boxSub.style.display = 'none';

    cardStyleSelect.addEventListener('change', (e) => {
        boxMain.className = `story-text-card ${e.target.value}`;
        boxSub.className = `story-text-card ${e.target.value}`;
    });

    textColorPicker.addEventListener('input', (e) => {
        textMain.style.color = e.target.value;
        textSub.style.color = e.target.value;
    });

    mediaFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileURL = URL.createObjectURL(file);

        if (file.type.startsWith('video')) {
            bgImage.style.display = 'none';
            bgVideo.src = fileURL;
            bgVideo.style.display = 'block';
            bgVideo.play();
        } else {
            bgVideo.style.display = 'none';
            bgImage.src = fileURL;
            bgImage.style.display = 'block';
        }
    });

    downloadPlateBtn.addEventListener('click', async () => {
        downloadPlateBtn.innerText = "Renderizando...";
        downloadPlateBtn.disabled = true;

        try {
            await new Promise(r => setTimeout(r, 600));
            const canvas = await html2canvas(previewBox, { useCORS: true, scale: 3 });
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = `gesto-smart-story-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            downloadPlateBtn.innerText = "¡Listo en tu celu! 📥";
        } catch (error) {
            alert("Error: " + error.message);
            downloadPlateBtn.innerText = "📥 Descargar Historia Pro";
        } finally {
            setTimeout(() => {
                downloadPlateBtn.innerText = "📥 Descargar Historia Pro";
                downloadPlateBtn.disabled = false;
            }, 2000);
        }
    });
</script>
</body>
</html>
