<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IG Story Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }

        .header { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 11px; color: var(--text-muted); }

        .content-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 78vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); }

        textarea, input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus, input[type="text"]:focus { border-color: var(--primary); }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        select, input[type="file"], input[type="color"] {
            width: 100%;
            padding: 7px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 11px;
            outline: none;
        }

        .action-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .action-btn.active {
            background: var(--primary);
            color: #0b0f19;
            border-color: var(--primary);
        }

        /* Lienzo Estilo Historia de Instagram (9:16 impecable) */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #000;
            border-radius: 12px;
            display: flex;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-bg-media {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: contain; /* Muestra la captura completa sin deformarla ni cortarla */
            background: #000;
            z-index: 1;
            display: none;
        }

        .preview-bg-video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        /* Elementos de texto flotantes interactivos (Estilo IG con arrastre visual simulado por botones) */
        .ig-text-element {
            position: absolute;
            width: 90%;
            left: 5%;
            z-index: 5;
            text-align: center;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: move;
            user-select: none;
        }

        /* Estilos de caja estilo IG */
        .style-classic {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .style-neon {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .style-raw {
            background: transparent;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.9);
        }

        .ig-text-content {
            font-size: 15px;
            line-height: 1.35;
            word-break: break-word;
            font-weight: 700;
        }

        /* Stickers rápidos flotantes */
        .ig-sticker {
            position: absolute;
            bottom: 20px;
            right: 15px;
            z-index: 6;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0b0f19;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .controls {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • IG Story Studio</h1>
        <p>Crea historias profesionales con motor visual avanzado.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>💬 Texto Principal (Gancho con Emojis)</label>
            <textarea id="input-main" placeholder="¿Cuánto tardás en hacer el catálogo? 😳">¿Cuánto tardás en hacer el catálogo? 😳</textarea>
        </div>

        <div class="form-group">
            <label>💬 Texto Secundario (CTA / Abajo)</label>
            <textarea id="input-sub" placeholder="Subí un excel y la magia ocurre sola 🚀">Subí el catálogo con un simple excel y la magia se hace sola. 🚀</textarea>
        </div>

        <div class="row-options">
            <div class="form-group">
                <label>Estilo de Tarjeta</label>
                <select id="card-style-select">
                    <option value="style-classic">Caja Clásica IG (Oscura)</option>
                    <option value="style-neon">Caja Neón Pro</option>
                    <option value="style-raw">Texto Libre (Sin Caja)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Color de Tipografía</label>
                <input type="color" id="text-color-picker" value="#ffffff">
            </div>
        </div>

        <div class="row-options">
            <div class="form-group">
                <label>Posición del Texto 1</label>
                <select id="pos-main-select">
                    <option value="top: 15px;">Arriba</option>
                    <option value="top: 40%;">Centro</option>
                    <option value="bottom: 80px;">Abajo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Posición del Texto 2</label>
                <select id="pos-sub-select">
                    <option value="top: 15px;">Arriba</option>
                    <option value="top: 40%;">Centro</option>
                    <option value="bottom: 80px;" selected>Abajo</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Subir Imagen o Captura de Tienda</label>
            <input type="file" id="media-file-input" accept="image/*,video/*">
        </div>

        <div class="form-group">
            <label>Vista Previa Interactiva (Estilo IG)</label>
            <div id="preview-box" class="preview-container">
                <img id="bg-image" class="preview-bg-media" alt="Fondo">
                <video id="bg-video" class="preview-bg-video" autoplay muted loop playsinline></video>
                
                <!-- Caja de Texto 1 -->
                <div id="box-main" class="ig-text-element style-classic" style="top: 15px;">
                    <p id="text-main" class="ig-text-content" style="color: #ffffff;">¿Cuánto tardás en hacer el catálogo? 😳</p>
                </div>

                <!-- Caja de Texto 2 -->
                <div id="box-sub" class="ig-text-element style-classic" style="bottom: 80px;">
                    <p id="text-sub" class="ig-text-content" style="color: #ffffff;">Subí el catálogo con un simple excel y la magia se hace sola. 🚀</p>
                </div>

                <div class="ig-sticker">gestosmart.app</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="download-plate-btn" class="btn">📥 Descargar Historia Pro</button>
    </div>
</div>

<script>
    const inputMain = document.getElementById('input-main');
    const inputSub = document.getElementById('input-sub');
    const textMain = document.getElementById('text-main');
    const textSub = document.getElementById('text-sub');
    const boxMain = document.getElementById('box-main');
    const boxSub = document.getElementById('box-sub');
    const cardStyleSelect = document.getElementById('card-style-select');
    const textColorPicker = document.getElementById('text-color-picker');
    const posMainSelect = document.getElementById('pos-main-select');
    const posSubSelect = document.getElementById('pos-sub-select');
    const mediaFileInput = document.getElementById('media-file-input');
    const bgImage = document.getElementById('bg-image');
    const bgVideo = document.getElementById('bg-video');
    const previewBox = document.getElementById('preview-box');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    inputMain.addEventListener('input', (e) => { textMain.innerText = e.target.value; });
    inputSub.addEventListener('input', (e) => { textSub.innerText = e.target.value; });

    cardStyleSelect.addEventListener('change', (e) => {
        boxMain.className = `ig-text-element ${e.target.value}`;
        boxSub.className = `ig-text-element ${e.target.value}`;
    });

    textColorPicker.addEventListener('input', (e) => {
        textMain.style.color = e.target.value;
        textSub.style.color = e.target.value;
    });

    posMainSelect.addEventListener('change', (e) => {
        boxMain.style.top = ''; boxMain.style.bottom = '';
        if(e.target.value.includes('top')) boxMain.style.top = '15px';
        else if(e.target.value.includes('40%')) boxMain.style.top = '40%';
        else boxMain.style.bottom = '80px';
    });

    posSubSelect.addEventListener('change', (e) => {
        boxSub.style.top = ''; boxSub.style.bottom = '';
        if(e.target.value.includes('top')) boxSub.style.top = '15px';
        else if(e.target.value.includes('40%')) boxSub.style.top = '40%';
        else boxSub.style.bottom = '80px';
    });

    mediaFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileURL = URL.createObjectURL(file);

        if (file.type.startsWith('video')) {
            bgImage.style.display = 'none';
            bgVideo.src = fileURL;
            bgVideo.style.display = 'block';
            bgVideo.play();
        } else {
            bgVideo.style.display = 'none';
            bgImage.src = fileURL;
            bgImage.style.display = 'block';
        }
    });

    downloadPlateBtn.addEventListener('click', async () => {
        downloadPlateBtn.innerText = "Renderizando...";
        downloadPlateBtn.disabled = true;

        try {
            await new Promise(r => setTimeout(r, 600));
            const canvas = await html2canvas(previewBox, { useCORS: true, scale: 3 });
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = `gesto-smart-story-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            downloadPlateBtn.innerText = "¡Listo en tu celu! 📥";
        } catch (error) {
            alert("Error: " + error.message);
            downloadPlateBtn.innerText = "📥 Descargar Historia Pro";
        } finally {
            setTimeout(() => {
                downloadPlateBtn.innerText = "📥 Descargar Historia Pro";
                downloadPlateBtn.disabled = false;
            }, 2000);
        }
    });
</script>
</body>
</html>
