<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Campaign Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Montserrat', sans-serif; }
        .canvas-wrapper { width: 100%; max-width: 400px; margin: 0 auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; transition: aspect-ratio 0.3s ease; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .magic-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 10px; border-radius: 8px; cursor: pointer; transition: all 0.2s; font-weight: bold; }
        .magic-btn:hover { background: #06b6d4; color: #0b0f19; border-color: #06b6d4; }
        
        .command-item { cursor: pointer; transition: all 0.2s; }
        .command-item:hover { background-color: #1e293b; border-left: 3px solid #06b6d4; }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50">
        <div>
            <h1 class="text-base font-black text-white tracking-tight">GESTO SMART <span class="text-cyan-400">CAMPAIGNS</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl">⚙️</button>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">

            <h2 class="font-bold text-lg mb-4 text-white">Motor IA (Gemini)</h2>
            <input type="password" id="apiKeyInput" placeholder="API Key..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-cyan-500">
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm hover:bg-slate-600">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-cyan-500 text-slate-900 p-3 rounded-lg font-bold text-sm hover:bg-cyan-400">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Directorio 99 Prompts (Modal Flotante) -->
    <div id="promptModal" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col p-4 backdrop-blur-md">
        <div class="max-w-md w-full mx-auto flex flex-col h-full bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
                <h2 class="font-bold text-white">📚 Directorio de 99 Prompts</h2>
                <button onclick="togglePromptModal()" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
            </div>
            <div class="p-3 bg-slate-900">
                <input type="text" id="promptSearch" onkeyup="filterPrompts()" placeholder="Buscar comando... (ej: viral, ceo, copy)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none focus:border-cyan-500">
            </div>
            <div id="promptList" class="flex-1 overflow-y-auto p-2 scrollbar-hide">
                <!-- Se inyecta por JS -->
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-4 mb-32">
        
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 shadow-lg">
            
            <div class="flex gap-2 mb-3">
                <label class="flex-[1] bg-slate-800 hover:bg-slate-700 transition text-center p-3 rounded-xl border border-dashed border-slate-500 cursor-pointer flex items-center justify-center">
                    <span class="text-sm font-bold text-cyan-400">📁 Subir Captura</span>
                    <input type="file" id="imageLoader" accept="image/*" class="hidden">
                </label>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-3">
                <select id="globalFont" class="bg-slate-950 border border-slate-700 p-2 rounded-lg text-xs text-white outline-none focus:border-cyan-500">
                    <option value="Playfair Display">Fuente: Playfair Display</option>
                    <option value="Montserrat">Fuente: Montserrat</option>
                    <option value="Cinzel">Fuente: Cinzel</option>
                </select>
                <select id="globalFormat" class="bg-slate-950 border border-slate-700 p-2 rounded-lg text-xs text-white outline-none focus:border-cyan-500" onchange="setFormat(this.value)">
                    <option value="9:16">Formato: Story/Reel</option>
                    <option value="1:1">Formato: Post Cuadrado</option>
                </select>
            </div>

            <!-- UI Corregida: Grilla limpia, todo a la vista, cero scroll oculto -->
            <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="togglePromptModal()" class="magic-btn col-span-3 bg-cyan-950 border-cyan-800 text-cyan-100 hover:bg-cyan-900 text-center py-3">📚 Explorar Directorio de 99 Comandos</button>
                <button onclick="applyMagicCommand('/dolor')" class="magic-btn text-center">🛑 Dolor</button>
                <button onclick="applyMagicCommand('/beneficio')" class="magic-btn text-center">✨ Beneficio</button>
                <button onclick="applyMagicCommand('/autoridad')" class="magic-btn text-center">🏆 Autoridad</button>
            </div>

            <textarea id="aiPrompt" placeholder="Instrucción (Podés usar comandos o texto libre)..." class="w-full h-20 bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-cyan-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full mt-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold p-3 rounded-xl shadow-lg shadow-cyan-500/20 flex justify-center items-center gap-2 hover:from-cyan-500 hover:to-blue-500">
                <span id="btnText">✨ Generar Campaña Completa</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <!-- Resultados de la Campaña -->
        <div id="resultsArea" class="hidden flex-col gap-4">
            
            <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
                <canvas id="mainCanvas"></canvas>
            </div>

            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-black text-sm hover:bg-slate-200 transition">
                📥 Descargar Placa
            </button>

            <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 mt-2">
                <h3 class="text-xs font-bold text-cyan-400 mb-2 uppercase">📝 Copy para Instagram / TikTok</h3>
                <textarea id="socialCaption" readonly class="w-full h-48 bg-slate-950 border border-slate-800 p-3 rounded-lg text-sm text-slate-300 outline-none resize-none"></textarea>
                <button onclick="copyCaption()" class="w-full mt-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold p-2 rounded-lg transition">
                    📋 Copiar Texto
                </button>
            </div>

        </div>

    </main>

<script>

    let currentImageObj = null;

    function initPromptDictionary() {
        const list = document.getElementById('promptList');
        list.innerHTML = '';
        Object.keys(promptDictionary).forEach(key => {
            const div = document.createElement('div');
            div.className = 'command-item p-3 border-b border-slate-800 text-sm';
            div.innerHTML = `<span class="font-bold text-cyan-400">${key}</span> <span class="text-slate-300 ml-2">${promptDictionary[key]}</span>`;
            div.onclick = () => {
                const currentVal = document.getElementById('aiPrompt').value;
                document.getElementById('aiPrompt').value = `${key} ${currentVal.replace(/^\/\w+\s*/, '')}`.trim();
                togglePromptModal();
            };
            list.appendChild(div);
        });
    }

    function filterPrompts() {
        const input = document.getElementById('promptSearch').value.toLowerCase();
        const items = document.querySelectorAll('.command-item');
        items.forEach(item => {
            if (item.innerText.toLowerCase().includes(input)) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });
    }

    function togglePromptModal() {
        const modal = document.getElementById('promptModal');
        modal.classList.toggle('hidden');
        if (!modal.classList.contains('hidden')) {
            document.getElementById('promptSearch').focus();
        }
    }

    window.onload = initPromptDictionary;

    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gesto_gemini_key', apiKey);
        toggleConfig();
    }

    const canvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true, backgroundColor: '#000' });
    canvas.setWidth(1080);
    canvas.setHeight(1920);

    function setFormat(format) {
        currentFormat = format;
        const wrapper = document.getElementById('canvasWrapper');
        if (format === '9:16') {
            canvas.setWidth(1080); canvas.setHeight(1920); wrapper.style.aspectRatio = '9/16';
        } else {
            canvas.setWidth(1080); canvas.setHeight(1080); wrapper.style.aspectRatio = '1/1';
        }
        if (currentImageObj) renderBaseImage(currentImageObj.lastOverlayOpacity || 0.4);
    }

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                renderBaseImage(0.4);
                document.getElementById('resultsArea').classList.remove('hidden');
                document.getElementById('resultsArea').classList.add('flex');
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        canvas.clear();
        currentImageObj.lastOverlayOpacity = overlayOpacity;

        const cw = canvas.getWidth();
        const ch = canvas.getHeight();
        const scale = Math.min(cw / currentImageObj.width, ch / currentImageObj.height);
        
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: cw / 2, top: ch / 2,
            scaleX: scale, scaleY: scale,
            selectable: true, hasControls: true
        });
        
        canvas.add(currentImageObj);
        canvas.sendToBack(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: cw, height: ch,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
            canvas.moveTo(overlay, 1);
        }
        canvas.renderAll();
    }

    function applyMagicCommand(command) { document.getElementById('aiPrompt').value = command; }

    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function generateWithAI() {
        let userInput = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Primero subí una captura del sistema.');
        if (!userInput) return alert('Escribí de qué trata la campaña o usá un comando.');
        if (!apiKey) { toggleConfig(); return alert('Falta tu API Key de Gemini.'); }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        btn.disabled = true; btnText.innerText = "Creando Campaña..."; spinner.classList.remove('hidden');

        canvas.getObjects().filter(obj => obj.type === 'textbox' || obj.type === 'group').forEach(obj => canvas.remove(obj));

        let extractedCommand = Object.keys(promptDictionary).find(cmd => userInput.toLowerCase().startsWith(cmd));
        let strategyContext = userInput;
        if (extractedCommand) {
            let instructionClean = userInput.slice(extractedCommand.length).trim();
            strategyContext = `Asume el rol/estrategia de: [${promptDictionary[extractedCommand]}]. Objetivo específico: ${instructionClean}`;
        }

        const PRODUCT_CONTEXT = `Gesto Smart es un sistema web de gestión, ventas y control de stock altamente intuitivo para comercios, reemplaza Excel y elimina fricciones operativas.`;

        const systemInstructions = `Eres un Growth Marketer B2B Senior. ${PRODUCT_CONTEXT}
        ESTRATEGIA REQUERIDA: ${strategyContext}
        
        Debes generar:
        1. Una "fraseBomba" visual (máximo 5-7 palabras). Central, corta, directa. Que frene el scroll.
        2. "copyInstagram": Texto persuasivo completo para publicar, usando emojis, espaciado visual, hashtags y un CTA fuerte al final. Trata de 'vos' o 'tú'.
        3. "paletaElegida": Aleatorio 1 (Blanco puro), 2 (Amarillo Pastel), 3 (Rosa), o 4 (Verde).
        
        Devuelve ÚNICAMENTE un JSON válido, SIN markdown:
        {
            "fraseBomba": "Texto corto y explosivo",
            "copyInstagram": "Texto persuasivo para el post...",
            "paletaElegida": 2,
            "nivelOscurecimiento": 0.5
        }`;

        // Nodos 100% estables y actualizados
        const modelsToTry = ['gemini-1.5-flash', 'gemini-1.5-pro'];
        let success = false;
        let lastError = "";

        for (const model of modelsToTry) {
            let retries = 2;
            while (retries > 0 && !success) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: systemInstructions }] }] })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || "Error desconocido en la API.");
                    
                    let textResponse = data.candidates[0].content.parts[0].text;
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    let aiResult = JSON.parse(textResponse);
                    
                    aplicarCampanaIA(aiResult);
                    success = true;
                    break; 
                } catch (error) {
                    lastError = error.message;
                    // Si el servidor está saturado reintenta. Si es un 404 (not found), sale del loop y salta al próximo modelo.
                    if (error.message && (error.message.includes('demand') || error.message.includes('503') || error.message.includes('429'))) {
                        btnText.innerText = `Saturado. Reintento...`;
                        await delay(3000); retries--;
                    } else { 
                        break; 
                    } 
                }
            }
            if (success) break; 
        }

        btn.disabled = false; btnText.innerText = "✨ Generar Campaña Completa"; spinner.classList.add('hidden');
        if (!success) alert(`Error de Conexión: La plataforma de Google está rechazando la petición. Detalles: ${lastError}`);
    }

    function aplicarCampanaIA(config) {
        document.getElementById('socialCaption').value = config.copyInstagram;

        renderBaseImage(config.nivelOscurecimiento || 0.5);
        const cw = canvas.getWidth();
        const ch = canvas.getHeight();
        const fontToUse = document.getElementById('globalFont').value;
        const isSerif = fontToUse === 'Playfair Display' || fontToUse === 'Cinzel';

        let fillColor = '#ffffff';
        if(config.paletaElegida == 2) fillColor = '#FEF08A'; 
        if(config.paletaElegida == 3) fillColor = '#FBCFE8'; 
        if(config.paletaElegida == 4) fillColor = '#4ade80'; 

        const textBomb = new fabric.Textbox((config.fraseBomba || "").toUpperCase(), {
            left: cw / 2, top: ch / 2,
            originX: 'center', originY: 'center',
            width: cw * 0.90,
            fontSize: isSerif ? 95 : 85,
            fontFamily: fontToUse,
            fontWeight: isSerif ? '700' : '900',
            fontStyle: fontToUse === 'Playfair Display' ? 'italic' : 'normal',
            fill: fillColor,
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.95)', blur: 30, offsetX: 0, offsetY: 10 }),
            lineHeight: 1.1
        });

        const logoBg = new fabric.Rect({ left: 0, top: 0, width: 320, height: 320, rx: 65, ry: 65, fill: '#0d111c', originX: 'center', originY: 'center' });
        const cyanBox = new fabric.Rect({ left: 0, top: -45, width: 150, height: 150, rx: 35, ry: 35, fill: 'transparent', stroke: '#06b6d4', strokeWidth: 9, originX: 'center', originY: 'center' });
        const letterG = new fabric.Text('G', { left: -2, top: -45, fontFamily: 'Montserrat', fontWeight: '900', fontStyle: 'italic', fontSize: 90, fill: '#ffffff', originX: 'center', originY: 'center' });
        const dot = new fabric.Circle({ left: 75, top: -120, radius: 12, fill: '#06b6d4', originX: 'center', originY: 'center' });
        const textGesto = new fabric.Text('GESTO', { left: 0, top: 55, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        const textSmart = new fabric.Text('SMART', { left: 0, top: 105, fontFamily: 'Montserrat', fontWeight: '300', fontSize: 48, fill: '#ffffff', originX: 'center', originY: 'center' });
        
        const logoGroup = new fabric.Group([logoBg, cyanBox, letterG, dot, textGesto, textSmart], {
            left: cw - (cw * 0.12), top: ch - (ch * 0.08),
            scaleX: 0.20, scaleY: 0.20, 
            originX: 'center', originY: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 }),
            selectable: true 
        });

        canvas.add(textBomb);
        canvas.add(logoGroup);
        canvas.renderAll();
    }

    function copyCaption() {
        const copyText = document.getElementById("socialCaption");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("¡Copy copiado al portapapeles!");
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_Campaña_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
