<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Pro Studio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700;900&family=Pacifico&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS para UI rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js Core: El motor gráfico profesional -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        
        /* Contenedor responsivo del Canvas */
        .canvas-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            background-color: #000;
            transition: aspect-ratio 0.3s ease;
        }

        /* Hack mágico para que Fabric.js se adapte visualmente sin perder los 1080p internos */
        .canvas-container {
            width: 100% !important;
            height: 100% !important;
        }
        .canvas-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }

        /* Estilos de botones y UI */
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border-top: 1px solid #334155;
        }
        
        /* Ocultar input file original */
        input[type="file"] { display: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="p-4 text-center border-b border-slate-700 bg-slate-900">
        <h1 class="text-lg font-black text-sky-400 tracking-tight">GESTO SMART <span class="text-white">STUDIO</span></h1>
        <p class="text-xs text-slate-400 mt-1">Motor de Canvas HD (Arrastrá y editá libremente)</p>
    </header>

    <!-- Área de Trabajo -->
    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-4 mb-32">
        
        <!-- Selector de Formato -->
        <div class="flex gap-2 justify-center">
            <button onclick="changeFormat(1080, 1920, '9/16')" class="format-btn bg-sky-500 text-slate-900 text-xs font-bold py-2 px-4 rounded-lg flex-1">Story 9:16</button>
            <button onclick="changeFormat(1080, 1350, '4/5')" class="format-btn bg-slate-800 text-white border border-slate-700 text-xs font-bold py-2 px-4 rounded-lg flex-1">Post 4:5</button>
            <button onclick="changeFormat(1080, 1080, '1/1')" class="format-btn bg-slate-800 text-white border border-slate-700 text-xs font-bold py-2 px-4 rounded-lg flex-1">Feed 1:1</button>
        </div>

        <!-- Lienzo (Canvas) -->
        <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
            <canvas id="mainCanvas"></canvas>
        </div>

    </main>

    <!-- Panel de Herramientas Fijo Abajo (Tipo IG/CapCut) -->
    <div class="fixed bottom-0 left-0 w-full glass-panel p-4 pb-6 z-50">
        <div class="max-w-md mx-auto">
            
            <!-- Herramientas de Texto (Solo visibles si hay texto seleccionado) -->
            <div id="textToolbar" class="hidden grid grid-cols-4 gap-2 mb-4">
                <select id="fontSelect" onchange="updateText('fontFamily', this.value)" class="col-span-2 bg-slate-800 text-xs p-2 rounded border border-slate-600 outline-none">
                    <option value="Montserrat">Moderna (Montserrat)</option>
                    <option value="Anton">Impacto (Anton)</option>
                    <option value="Pacifico">Script (Pacifico)</option>
                    <option value="Playfair Display">Elegante (Serif)</option>
                </select>
                <input type="color" id="colorPicker" onchange="updateText('fill', this.value)" value="#ffffff" class="w-full h-8 rounded cursor-pointer border-none p-0">
                <button onclick="toggleTextBg()" class="bg-slate-700 text-xs font-bold rounded">Caja IG</button>
            </div>

            <!-- Botones de Acción Principales -->
            <div class="grid grid-cols-4 gap-2">
                <label class="col-span-1 bg-slate-800 flex flex-col items-center justify-center py-3 rounded-xl border border-slate-600 cursor-pointer hover:bg-slate-700 transition">
                    <span class="text-xl mb-1">🖼️</span>
                    <span class="text-[10px] font-bold">Fondo</span>
                    <input type="file" id="imageLoader" accept="image/*">
                </label>
                
                <button onclick="addText()" class="col-span-1 bg-slate-800 flex flex-col items-center justify-center py-3 rounded-xl border border-slate-600 hover:bg-slate-700 transition">
                    <span class="text-xl mb-1">🔤</span>
                    <span class="text-[10px] font-bold">Texto</span>
                </button>

                <button onclick="deleteSelected()" class="col-span-1 bg-rose-900/50 flex flex-col items-center justify-center py-3 rounded-xl border border-rose-800 text-rose-300 hover:bg-rose-800 transition">
                    <span class="text-xl mb-1">🗑️</span>
                    <span class="text-[10px] font-bold">Borrar</span>
                </button>

                <button onclick="downloadImage()" class="col-span-1 bg-sky-500 flex flex-col items-center justify-center py-3 rounded-xl text-slate-900 hover:bg-sky-400 transition shadow-lg shadow-sky-500/30">
                    <span class="text-xl mb-1">📥</span>
                    <span class="text-[10px] font-bold">Exportar</span>
                </button>
            </div>
        </div>
    </div>

<script>
    // 1. Inicialización del Motor Fabric.js
    const canvas = new fabric.Canvas('mainCanvas', {
        preserveObjectStacking: true, // Que el texto siempre quede arriba al tocar
        backgroundColor: '#090d16'
    });

    // Resolución interna fija (Alta Definición siempre)
    let currentWidth = 1080;
    let currentHeight = 1920;
    canvas.setWidth(currentWidth);
    canvas.setHeight(currentHeight);

    let currentBackgroundImage = null;

    // 2. Control de la interfaz cuando seleccionamos un objeto (Texto)
    canvas.on('selection:created', showTextToolbar);
    canvas.on('selection:updated', showTextToolbar);
    canvas.on('selection:cleared', hideTextToolbar);

    function showTextToolbar(e) {
        if (e.selected[0].type === 'textbox') {
            document.getElementById('textToolbar').classList.remove('hidden');
            document.getElementById('colorPicker').value = e.selected[0].fill;
            document.getElementById('fontSelect').value = e.selected[0].fontFamily;
        }
    }

    function hideTextToolbar() {
        document.getElementById('textToolbar').classList.add('hidden');
    }

    // 3. Sistema inteligente de carga de fondo (El CROP perfecto)
    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentBackgroundImage = img;
                applyBackground();
            });
        };
        reader.readAsDataURL(file);
    });

    function applyBackground() {
        if (!currentBackgroundImage) return;
        
        const img = currentBackgroundImage;
        // Matemáticas para hacer el "object-fit: cover" perfecto
        const scale = Math.max(currentWidth / img.width, currentHeight / img.height);
        
        img.set({
            originX: 'center',
            originY: 'center',
            left: currentWidth / 2,
            top: currentHeight / 2,
            scaleX: scale,
            scaleY: scale
        });

        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
    }

    // 4. Inserción de Texto (Estilo Instagram)
    function addText() {
        const text = new fabric.Textbox('DOBLE CLIC PARA EDITAR', {
            left: currentWidth / 2,
            top: currentHeight / 2,
            originX: 'center',
            originY: 'center',
            width: 800,
            fontSize: 70,
            fontFamily: 'Montserrat',
            fontWeight: 'bold',
            fill: '#ffffff',
            textAlign: 'center',
            // Estilos del manipulador
            cornerColor: '#38bdf8',
            cornerStyle: 'circle',
            borderColor: '#38bdf8',
            transparentCorners: false,
            padding: 20
        });
        canvas.add(text);
        canvas.setActiveObject(text);
    }

    // 5. Actualización de propiedades del texto (Color, Fuente)
    function updateText(property, value) {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            activeObj.set(property, value);
            canvas.renderAll();
        }
    }

    // 6. Efecto "Caja Translúcida" estilo Instagram Stories
    function toggleTextBg() {
        const activeObj = canvas.getActiveObject();
        if (activeObj && activeObj.type === 'textbox') {
            if (activeObj.backgroundColor) {
                activeObj.set('backgroundColor', null);
            } else {
                activeObj.set('backgroundColor', 'rgba(0, 0, 0, 0.65)');
            }
            canvas.renderAll();
        }
    }

    // 7. Borrar objeto seleccionado
    function deleteSelected() {
        const activeObj = canvas.getActiveObject();
        if (activeObj) {
            canvas.remove(activeObj);
            hideTextToolbar();
        }
    }

    // Permitir borrar con tecla Delete/Backspace en PC
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Delete' && canvas.getActiveObject() && !canvas.getActiveObject().isEditing) {
            deleteSelected();
        }
    });

    // 8. Cambio de Formato Inteligente (1 Clic)
    function changeFormat(w, h, ratioStr) {
        currentWidth = w;
        currentHeight = h;
        
        // Ajustar Canvas Interno
        canvas.setWidth(currentWidth);
        canvas.setHeight(currentHeight);
        
        // Ajustar UI Externa Visual
        document.getElementById('canvasWrapper').style.aspectRatio = ratioStr;

        // Reajustar UI de botones
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.classList.remove('bg-sky-500', 'text-slate-900');
            btn.classList.add('bg-slate-800', 'text-white', 'border-slate-700');
        });
        event.target.classList.add('bg-sky-500', 'text-slate-900');
        event.target.classList.remove('bg-slate-800', 'text-white', 'border-slate-700');

        // Reencuadrar fondo y renderizar
        applyBackground();
    }

    // 9. Exportación en Alta Calidad Directa (Zero Server)
    function downloadImage() {
        // Deseleccionar todo para que no salgan los cuadritos azules de edición
        canvas.discardActiveObject();
        canvas.renderAll();

        const dataURL = canvas.toDataURL({
            format: 'png',
            quality: 1,
            multiplier: 1 // Como ya es 1080p, no hace falta multiplicar
        });

        const link = document.createElement('a');
        link.download = `GestoSmart_Export_${Date.now()}.png`;
        link.href = dataURL;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
