<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • Creador Estilo Instagram</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
        
        .app-container {
            background: var(--surface);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { padding: 14px; text-align: center; border-bottom: 1px solid var(--border); background: #0f172a; }
        .header h1 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
        .header p { font-size: 11px; color: var(--text-muted); }

        .content-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 78vh;
            overflow-y: auto;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            color: white;
            resize: none;
            outline: none;
        }
        textarea:focus { border-color: var(--primary); }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .toggle-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .toggle-btn.active {
            background: var(--primary);
            color: #0b0f19;
            border-color: var(--primary);
        }

        /* Vista Previa Estilo Editor de Historia 9:16 nativo sin espacios negros */
        .preview-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            background: #0f172a;
            border-radius: 12px;
            display: flex;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            justify-content: center;
            align-items: center;
        }

        /* La imagen llena toda la pantalla vertical de punta a punta */
        .preview-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Capa oscura sutil opcional para que realce el texto sobre la foto */
        .preview-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        /* Capa de texto flotante libre (estilo IG) */
        .preview-text-box {
            position: absolute;
            width: 88%;
            z-index: 3;
            text-align: center;
            padding: 12px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        /* Posiciones del texto */
        .align-top { top: 20px; }
        .align-center { top: 50%; transform: translateY(-50%); }
        .align-bottom { bottom: 30px; }

        /* Estilos de Fondo para el texto */
        .bg-box-on {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .bg-box-off {
            background: transparent;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0,0,0,0.9);
        }

        .preview-hook {
            font-size: 16px;
            line-height: 1.35;
            word-break: break-word;
            color: #ffffff;
        }

        .controls {
            padding: 12px 14px;
            background: #0f172a;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
        }

        .btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .btn-secondary { background: var(--surface-hover); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Gesto Smart • Editor Libre</h1>
        <p>Cero franjas negras: pantalla completa para redes.</p>
    </div>

    <div class="content-body">
        <div class="form-group">
            <label>Texto y Emojis 📝✨</label>
            <textarea id="script-input" placeholder="Escribe tu gancho con emojis...">¿La agenda de papel? 😳 Y si pudieras tener todo en tu tablet o compu? 🚀</textarea>
        </div>

        <div class="row-options">
            <div class="form-group">
                <label>Tipografía (Fuente)</label>
                <select id="font-family-select">
                    <option value="-apple-system, sans-serif">Moderna (Clean)</option>
                    <option value="Impact, sans-serif">Titular Fuerte (Impact)</option>
                    <option value="'Courier New', monospace">Clásica / Código</option>
                    <option value="'Georgia', serif">Elegante (Serif)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ubicación del Texto</label>
                <select id="text-align-select">
                    <option value="align-bottom">Abajo</option>
                    <option value="align-center">Centro</option>
                    <option value="align-top">Arriba</option>
                </select>
            </div>
        </div>

        <div class="row-options">
            <div class="form-group">
                <label>Fondo detrás del texto</label>
                <button type="button" id="toggle-bg-btn" class="toggle-btn active">Caja Oscura: ON</button>
            </div>
            <div class="form-group">
                <label>Alineación del texto</label>
                <select id="text-justify-select">
                    <option value="center">Centrado</option>
                    <option value="left">Izquierda</option>
                    <option value="right">Derecha</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Subir Imagen o Flyer Base</label>
            <input type="file" id="media-file-input" accept="image/*">
        </div>

        <div class="form-group">
            <label>Vista Previa Interactiva (Pantalla Completa)</label>
            <div id="preview-box" class="preview-container">
                <img id="bg-image" class="preview-bg-image" alt="Flyer" style="display: none;">
                <div class="preview-overlay"></div>
                <div id="preview-text-box" class="preview-text-box align-bottom bg-box-on">
                    <p id="preview-text" class="preview-hook">¿La agenda de papel? 😳 Y si pudieras tener todo en tu tablet o compu? 🚀</p>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="copy-text-btn" class="btn btn-secondary">Copiar Copy</button>
        <button id="download-plate-btn" class="btn">📥 Descargar Historia</button>
    </div>
</div>

<script>
    const scriptInput = document.getElementById('script-input');
    const previewText = document.getElementById('preview-text');
    const previewTextBox = document.getElementById('preview-text-box');
    const fontFamilySelect = document.getElementById('font-family-select');
    const textAlignSelect = document.getElementById('text-align-select');
    const textJustifySelect = document.getElementById('text-justify-select');
    const toggleBgBtn = document.getElementById('toggle-bg-btn');
    const mediaFileInput = document.getElementById('media-file-input');
    const bgImage = document.getElementById('bg-image');
    const previewBox = document.getElementById('preview-box');
    const copyTextBtn = document.getElementById('copy-text-btn');
    const downloadPlateBtn = document.getElementById('download-plate-btn');

    let hasBoxBg = true;

    scriptInput.addEventListener('input', (e) => {
        previewText.innerText = e.target.value || "Escribe tu texto...";
    });

    fontFamilySelect.addEventListener('change', (e) => {
        previewText.style.fontFamily = e.target.value;
    });

    textAlignSelect.addEventListener('change', (e) => {
        previewTextBox.className = `preview-text-box ${e.target.value} ${hasBoxBg ? 'bg-box-on' : 'bg-box-off'}`;
    });

    textJustifySelect.addEventListener('change', (e) => {
        previewText.style.textAlign = e.target.value;
    });

    toggleBgBtn.addEventListener('click', () => {
        hasBoxBg = !hasBoxBg;
        if (hasBoxBg) {
            toggleBgBtn.classList.add('active');
            toggleBgBtn.innerText = "Caja Oscura: ON";
            previewTextBox.classList.remove('bg-box-off');
            previewTextBox.classList.add('bg-box-on');
        } else {
            toggleBgBtn.classList.remove('active');
            toggleBgBtn.innerText = "Caja Oscura: OFF";
            previewTextBox.classList.remove('bg-box-on');
            previewTextBox.classList.add('bg-box-off');
        }
    });

    mediaFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        bgImage.src = URL.createObjectURL(file);
        bgImage.style.display = 'block';
    });

    copyTextBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(scriptInput.value);
        copyTextBtn.innerText = "¡Copiado! ✅";
        setTimeout(() => copyTextBtn.innerText = "Copiar Copy", 2000);
    });

    downloadPlateBtn.addEventListener('click', async () => {
        downloadPlateBtn.innerText = "Generando...";
        downloadPlateBtn.disabled = true;

        try {
            await new Promise(r => setTimeout(r, 800));

            const canvas = await html2canvas(previewBox, {
                useCORS: true,
                scale: 3
            });

            const imageURI = canvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.href = imageURI;
            link.download = `gesto-smart-story-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            downloadPlateBtn.innerText = "¡Listo en tu celu! 📥";
        } catch (error) {
            alert("Error al descargar: " + error.message);
            downloadPlateBtn.innerText = "📥 Descargar Historia";
        } finally {
            setTimeout(() => {
                downloadPlateBtn.innerText = "📥 Descargar Historia";
                downloadPlateBtn.disabled = false;
            }, 2500);
        }
    });
</script>
</body>
</html>
