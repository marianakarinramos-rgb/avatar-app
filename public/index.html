<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IA Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .canvas-wrapper { width: 100%; max-width: 380px; margin: 0 auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header & Config -->
    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50">
        <div>
            <h1 class="text-base font-black text-white tracking-tight">GESTO SMART <span class="text-sky-400">IA STUDIO</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl" title="Configurar API">⚙️</button>
    </header>

    <!-- Modal Configuración API -->
    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
            <h2 class="font-bold text-lg mb-2 text-white">Motor IA (Groq)</h2>
            <p class="text-xs text-slate-400 mb-4">Ingresa tu API Key de Groq. Asegurate de no dejar espacios en blanco al copiarla.</p>
            <input type="password" id="apiKeyInput" placeholder="gsk_..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-4 focus:border-sky-500">
            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-sky-500 text-slate-900 p-3 rounded-lg font-bold text-sm">Guardar Key</button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-5 mb-24">
        
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 shadow-lg">
            <label class="block w-full bg-slate-800 hover:bg-slate-700 transition text-center p-3 rounded-xl border border-dashed border-slate-500 cursor-pointer mb-3">
                <span class="text-sm font-bold text-sky-400">📁 1. Subir tu Imagen de Fondo</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <textarea id="aiPrompt" placeholder="Ej: Hacé una placa para promocionar mi app en una peluquería. Que el texto venda ahorro de tiempo. Oscurecé un poco el fondo." class="w-full h-24 bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-sky-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full mt-3 bg-gradient-to-r from-sky-500 to-indigo-500 text-white font-bold p-3 rounded-xl shadow-lg shadow-sky-500/20 flex justify-center items-center gap-2">
                <span id="btnText">✨ 2. Redactar y Diseñar (IA)</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
            <canvas id="mainCanvas"></canvas>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md p-4 border-t border-slate-800 z-40">
        <div class="max-w-md mx-auto">
            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-black text-sm hover:bg-slate-200 transition">
                📥 Descargar Placa
            </button>
        </div>
    </div>

<script>
    let apiKey = localStorage.getItem('gesto_api_key') || '';
    
    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('gesto_api_key', apiKey);
        toggleConfig();
    }

    const canvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true, backgroundColor: '#000' });
    canvas.setWidth(1080);
    canvas.setHeight(1920);

    let currentImageObj = null;

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                renderBaseImage(0);
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        
        canvas.clear();
        canvas.backgroundColor = '#000';

        const scale = Math.max(1080 / currentImageObj.width, 1920 / currentImageObj.height);
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: 540, top: 960,
            scaleX: scale, scaleY: scale
        });
        
        canvas.add(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: 1080, height: 1920,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
        }
        canvas.renderAll();
    }

    async function generateWithAI() {
        const prompt = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Paso 1: Subí la imagen de fondo primero.');
        if (!prompt) return alert('Paso 2: Escribí de qué trata la placa para la IA.');
        if (!apiKey) {
            toggleConfig();
            return alert('Falta configurar tu API Key de Groq.');
        }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        
        btn.disabled = true;
        btnText.innerText = "Procesando...";
        spinner.classList.remove('hidden');

        const systemPrompt = `Eres un Director de Arte y Copywriter de marketing. El usuario te dará contexto. Tu tarea es devolver ÚNICAMENTE un objeto JSON válido con la configuración visual. No uses markdown. 
        JSON Requerido:
        {
            "ganchoSuperior": "Texto corto y muy llamativo (max 8 palabras)",
            "llamadaInferior": "Texto de acción (max 12 palabras)",
            "tipografia": "Bebas Neue", 
            "colorTexto": "#FFFFFF", 
            "nivelOscurecimiento": 0.5 
        }`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192", // <-- ACÁ ESTÁ EL ARREGLO: Modelo estable universal de Groq
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: prompt }
                    ],
                    response_format: { type: "json_object" }
                })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || `Error HTTP: ${response.status}`);
            }

            const data = await response.json();
            
            let aiResult;
            try {
                aiResult = JSON.parse(data.choices[0].message.content);
            } catch (e) {
                throw new Error("La IA no devolvió un formato JSON válido. Modificá un poco el texto e intentá de nuevo.");
            }

            aplicarDisenoIA(aiResult);

        } catch (error) {
            console.error(error);
            alert(`Error de API Groq: ${error.message}`);
        } finally {
            btn.disabled = false;
            btnText.innerText = "✨ 2. Redactar y Diseñar (IA)";
            spinner.classList.add('hidden');
        }
    }

    function aplicarDisenoIA(config) {
        renderBaseImage(config.nivelOscurecimiento || 0.4);

        const textTop = new fabric.Textbox((config.ganchoSuperior || "TU TEXTO AQUÍ").toUpperCase(), {
            left: 540, top: 200,
            originX: 'center', originY: 'top',
            width: 900,
            fontSize: config.tipografia === 'Bebas Neue' ? 110 : 75,
            fontFamily: config.tipografia || 'Montserrat',
            fontWeight: 'bold',
            fill: config.colorTexto || '#ffffff',
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 15, offsetX: 0, offsetY: 4 })
        });

        const textBottom = new fabric.Textbox(config.llamadaInferior || "Llamado a la acción", {
            left: 540, top: 1600,
            originX: 'center', originY: 'bottom',
            width: 900,
            fontSize: 55,
            fontFamily: 'Montserrat', 
            fontWeight: 'normal',
            fill: '#ffffff',
            textAlign: 'center',
            backgroundColor: 'rgba(0,0,0,0.6)',
            padding: 20,
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 })
        });

        canvas.add(textTop);
        canvas.add(textBottom);
        canvas.renderAll();
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_IA_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
