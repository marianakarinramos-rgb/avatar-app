<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesto Smart • IA Studio Pro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        body { background-color: #0b0f19; color: #f8fafc; }
        .canvas-wrapper { width: 100%; max-width: 380px; margin: 0 auto; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border-radius: 16px; overflow: hidden; border: 1px solid #1e293b; background-color: #000; }
        .canvas-container { width: 100% !important; height: 100% !important; }
        .canvas-container canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        .spinner { border: 3px solid rgba(56, 189, 248, 0.3); border-left-color: #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .magic-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .magic-btn:hover { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-4 flex justify-between items-center border-b border-slate-800 bg-slate-900/50">
        <div>
            <h1 class="text-base font-black text-white tracking-tight">GESTO SMART <span class="text-sky-400">IA STUDIO</span></h1>
        </div>
        <button onclick="toggleConfig()" class="text-slate-400 hover:text-white text-xl" title="Configurar API">⚙️</button>
    </header>

    <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm">
            <h2 class="font-bold text-lg mb-2 text-white">Motor IA (Google Gemini)</h2>
            <p class="text-xs text-slate-400 mb-4">La app incluye Auto-Reintento por si los servidores están saturados.</p>
            
            <label class="block text-xs font-bold text-slate-400 mb-1">API Key de Gemini</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-sky-500">
            
            <label class="block text-xs font-bold text-slate-400 mb-1">Modelo Activo</label>
            <select id="modelSelect" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-lg text-sm text-white outline-none mb-6 focus:border-sky-500">
                <option value="gemini-3.6-flash">Gemini 3.6 Flash (Oficial y Rápido)</option>
                <option value="gemini-3.6-pro">Gemini 3.6 Pro (Avanzado)</option>
            </select>

            <div class="flex gap-2">
                <button onclick="toggleConfig()" class="flex-1 bg-slate-700 p-3 rounded-lg font-bold text-sm hover:bg-slate-600">Cerrar</button>
                <button onclick="saveApiKey()" class="flex-1 bg-sky-500 text-slate-900 p-3 rounded-lg font-bold text-sm hover:bg-sky-400">Guardar</button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-4 w-full max-w-md mx-auto gap-4 mb-24">
        
        <div class="bg-slate-900/50 p-4 rounded-2xl border border-slate-800 shadow-lg">
            
            <label class="block w-full bg-slate-800 hover:bg-slate-700 transition text-center p-3 rounded-xl border border-dashed border-slate-500 cursor-pointer mb-3">
                <span class="text-sm font-bold text-sky-400">📁 1. Subir tu Imagen Base</span>
                <input type="file" id="imageLoader" accept="image/*" class="hidden">
            </label>

            <!-- Botonera Mágica -->
            <div class="flex gap-2 overflow-x-auto pb-2 mb-2 scrollbar-hide">
                <button onclick="applyMagicCommand('/scrollstopper')" class="magic-btn">🛑 /scrollstopper</button>
                <button onclick="applyMagicCommand('/premiumshowcase')" class="magic-btn">✨ /premiumshowcase</button>
                <button onclick="applyMagicCommand('/sellwithoutselling')" class="magic-btn">🤝 /sellwithoutselling</button>
                <button onclick="applyMagicCommand('/meme')" class="magic-btn">😂 /meme</button>
            </div>

            <textarea id="aiPrompt" placeholder="Tocá un comando arriba o escribí tu idea libre..." class="w-full h-16 bg-slate-950 border border-slate-700 p-3 rounded-xl text-sm text-white outline-none resize-none focus:border-sky-500"></textarea>
            
            <button id="generateBtn" onclick="generateWithAI()" class="w-full mt-3 bg-gradient-to-r from-sky-500 to-indigo-500 text-white font-bold p-3 rounded-xl shadow-lg shadow-sky-500/20 flex justify-center items-center gap-2 hover:from-sky-400 hover:to-indigo-400">
                <span id="btnText">✨ 2. Aplicar Magia (IA)</span>
                <div id="loadingSpinner" class="spinner hidden"></div>
            </button>
        </div>

        <!-- Canvas HD -->
        <div id="canvasWrapper" class="canvas-wrapper" style="aspect-ratio: 9/16;">
            <canvas id="mainCanvas"></canvas>
        </div>

    </main>

    <div class="fixed bottom-0 left-0 w-full bg-slate-900/90 backdrop-blur-md p-4 border-t border-slate-800 z-40">
        <div class="max-w-md mx-auto">
            <button onclick="downloadImage()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-black text-sm hover:bg-slate-200 transition">
                📥 Descargar Placa Lista
            </button>
        </div>
    </div>

<script>
    // Limpiar modelos viejos (1.5, pro clásico, etc.)
    let savedModel = localStorage.getItem('gesto_gemini_model');
    if (savedModel && !savedModel.includes('3.6')) {
        savedModel = 'gemini-3.6-flash';
        localStorage.setItem('gesto_gemini_model', savedModel);
    }

    let apiKey = localStorage.getItem('gesto_gemini_key') || '';
    
    function toggleConfig() {
        const modal = document.getElementById('configModal');
        modal.classList.toggle('hidden');
        document.getElementById('apiKeyInput').value = apiKey;
        document.getElementById('modelSelect').value = localStorage.getItem('gesto_gemini_model') || 'gemini-3.6-flash';
    }

    function saveApiKey() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        const selectedModel = document.getElementById('modelSelect').value;
        localStorage.setItem('gesto_gemini_key', apiKey);
        localStorage.setItem('gesto_gemini_model', selectedModel);
        toggleConfig();
    }

    const magicPrompts = {
        '/scrollstopper': "OBJETIVO: Frenar el scroll. TEXTO GIGANTE Y AGRESIVO. Crea un gancho superior corto y polémico que genere curiosidad. El CTA inferior debe incitar a la acción. Oscurece la imagen (0.6) para alto contraste. Usa fuente Bebas Neue o Impact.",
        '/premiumshowcase': "OBJETIVO: Percepción de alto valor/lujo. Crea un copy elegante, minimalista y aspiracional. Oscurece la foto moderadamente (0.4). Usa fuente Playfair Display o Cinzel.",
        '/sellwithoutselling': "OBJETIVO: Vender aportando valor. Crea un gancho superior empático (ej: 'El 80% de los negocios pierden dinero en...'). El CTA abajo debe invitar a resolverlo. Usa fuente Montserrat. Oscurece poco (0.3).",
        '/meme': "OBJETIVO: Humor e identificación. Crea un gancho superior estilo 'Cuando...' sobre un problema común. El CTA abajo debe ser sarcástico. Usa fuente Montserrat y oscurece poco."
    };

    function applyMagicCommand(command) {
        document.getElementById('aiPrompt').value = command;
    }

    const canvas = new fabric.Canvas('mainCanvas', { preserveObjectStacking: true, backgroundColor: '#000' });
    canvas.setWidth(1080);
    canvas.setHeight(1920);
    let currentImageObj = null;

    document.getElementById('imageLoader').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (f) {
            fabric.Image.fromURL(f.target.result, function (img) {
                currentImageObj = img;
                renderBaseImage(0);
            });
        };
        reader.readAsDataURL(file);
    });

    function renderBaseImage(overlayOpacity) {
        if (!currentImageObj) return;
        
        canvas.clear();
        canvas.backgroundColor = '#000';

        const scale = Math.max(1080 / currentImageObj.width, 1920 / currentImageObj.height);
        currentImageObj.set({
            originX: 'center', originY: 'center',
            left: 540, top: 960,
            scaleX: scale, scaleY: scale
        });
        
        canvas.add(currentImageObj);

        if (overlayOpacity > 0) {
            const overlay = new fabric.Rect({
                left: 0, top: 0, width: 1080, height: 1920,
                fill: `rgba(0,0,0,${overlayOpacity})`,
                selectable: false, evented: false
            });
            canvas.add(overlay);
        }
        canvas.renderAll();
    }

    // Función de pausa para el Auto-Reintento
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function generateWithAI() {
        let userInput = document.getElementById('aiPrompt').value.trim();
        if (!currentImageObj) return alert('Paso 1: Subí la imagen de fondo primero.');
        if (!userInput) return alert('Paso 2: Escribí una idea o usá un comando mágico.');
        if (!apiKey) {
            toggleConfig();
            return alert('Falta configurar tu API Key de Gemini.');
        }

        const btn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        
        btn.disabled = true;
        btnText.innerText = "Pensando copy...";
        spinner.classList.remove('hidden');

        let hiddenContext = "";
        if (magicPrompts[userInput]) {
            hiddenContext = magicPrompts[userInput];
        } else {
            const possibleCommand = Object.keys(magicPrompts).find(cmd => userInput.startsWith(cmd));
            if(possibleCommand){
                hiddenContext = magicPrompts[possibleCommand] + " Detalle extra: " + userInput.replace(possibleCommand, "");
            } else {
                hiddenContext = "Sigue las instrucciones textuales: " + userInput;
            }
        }

        const systemInstructions = `Eres un Director de Arte y Copywriter. ESTRATEGIA: ${hiddenContext}
        Devuelve ÚNICAMENTE un objeto JSON válido, SIN formato markdown ni explicaciones.
        JSON Requerido:
        {
            "ganchoSuperior": "Texto de impacto arriba",
            "llamadaInferior": "Texto de CTA abajo",
            "tipografia": "Bebas Neue", 
            "colorTexto": "#FFFFFF", 
            "nivelOscurecimiento": 0.5 
        }
        Opciones de tipografia: Bebas Neue, Playfair Display, Montserrat, Cinzel.`;

        // SOLO usamos la familia 3.6
        const preferredModel = localStorage.getItem('gesto_gemini_model') || 'gemini-3.6-flash';
        const modelsToTry = [...new Set([preferredModel, 'gemini-3.6-flash', 'gemini-3.6-pro'])];
        
        let success = false;
        let lastError = "";

        for (const model of modelsToTry) {
            let retries = 2; // Le damos 2 intentos a cada modelo si hay congestión

            while (retries > 0 && !success) {
                try {
                    console.log(`Intentando conectar con modelo: ${model}`);
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: systemInstructions }] }]
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error?.message || `Error HTTP: ${response.status}`);
                    }
                    
                    let textResponse = data.candidates[0].content.parts[0].text;
                    textResponse = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    let aiResult;
                    try {
                        aiResult = JSON.parse(textResponse);
                    } catch (e) {
                        throw new Error("Respuesta inválida de la IA. Reintentando...");
                    }

                    aplicarDisenoIA(aiResult);
                    success = true;
                    break; 
                    
                } catch (error) {
                    if (error.message.toLowerCase().includes('high demand') || error.message.includes('503') || error.message.includes('429')) {
                        console.warn(`Alta demanda en ${model}. Reintentando en 3 segundos...`);
                        btnText.innerText = "Servidor saturado. Reintentando...";
                        await delay(3000); 
                        retries--;
                        lastError = "Los servidores de Google están muy saturados. Por favor, intentá de nuevo en unos minutos.";
                    } else if (error.message.toLowerCase().includes('not found')) {
                        console.warn(`El modelo ${model} no está disponible. Pasando al siguiente...`);
                        lastError = error.message;
                        break; // Salimos del while y pasamos al siguiente modelo (ej: de flash a pro)
                    } else {
                        lastError = error.message;
                        break; 
                    }
                }
            }
            if (success) break; 
        }

        btn.disabled = false;
        btnText.innerText = "✨ 2. Aplicar Magia (IA)";
        spinner.classList.add('hidden');

        if (!success) {
            alert(`Error de Google: ${lastError}`);
        }
    }

    function aplicarDisenoIA(config) {
        renderBaseImage(config.nivelOscurecimiento || 0.4);

        const textTop = new fabric.Textbox((config.ganchoSuperior || "").toUpperCase(), {
            left: 540, top: 200,
            originX: 'center', originY: 'top',
            width: 900,
            fontSize: config.tipografia === 'Bebas Neue' ? 120 : 80,
            fontFamily: config.tipografia || 'Montserrat',
            fontWeight: 'bold',
            fill: config.colorTexto || '#ffffff',
            textAlign: 'center',
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.8)', blur: 15, offsetX: 0, offsetY: 4 })
        });

        const textBottom = new fabric.Textbox(config.llamadaInferior || "", {
            left: 540, top: 1600,
            originX: 'center', originY: 'bottom',
            width: 900,
            fontSize: 55,
            fontFamily: 'Montserrat', 
            fontWeight: 'normal',
            fill: '#ffffff',
            textAlign: 'center',
            backgroundColor: 'rgba(0,0,0,0.7)',
            padding: 20,
            shadow: new fabric.Shadow({ color: 'rgba(0,0,0,0.5)', blur: 10 })
        });

        canvas.add(textTop);
        canvas.add(textBottom);
        canvas.renderAll();
    }

    function downloadImage() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const link = document.createElement('a');
        link.download = `GestoSmart_Magic_${Date.now()}.png`;
        link.href = canvas.toDataURL({ format: 'png', quality: 1 });
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
</body>
</html>
